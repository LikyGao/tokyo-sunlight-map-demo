name: Publish sunlight map

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunlight-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare existing site and mobile configuration
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const token = process.env.MAPBOX_PUBLIC_TOKEN;
          if (!token || !token.startsWith('pk.')) throw new Error('MAPBOX_PUBLIC_TOKEN must be a public token');
          writeFileSync('_site/mobile/public-config.js', 'window.sunlightConfig = ' + JSON.stringify({ mapboxPublicToken: token }) + ';\n');
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
