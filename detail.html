<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0795f2" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<title>詳細3Dモード — 東京 日当たりマップ</title>

<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16.png" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/"
} }
</script>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;font-family:system-ui,"Yu Gothic",Meiryo,sans-serif}
#c{position:absolute;inset:0}
#panel{position:absolute;top:10px;left:10px;z-index:5;width:300px;max-width:calc(100% - 20px);
  background:rgba(24,28,34,.94);color:#e8edf2;border:1px solid #2b3340;border-radius:10px;
  padding:14px;max-height:calc(100% - 20px);overflow:auto}
h1{font-size:14px;margin:0 0 4px}
.sub{font-size:11px;color:#8d99a8;margin:0 0 10px}
.back{display:inline-block;margin-bottom:8px;padding:6px 12px;background:#222a33;color:#e8edf2;
  border:1px solid #2b3340;border-radius:6px;text-decoration:none;font-size:13px}
.back:hover{background:#2c3640}
.mobile-back{display:none}
label{display:block;font-size:12px;color:#8d99a8;margin:10px 0 4px}
input[type=date]{width:100%;background:#0f141b;border:1px solid #2b3340;color:#e8edf2;border-radius:6px;padding:6px 8px}
input[type=range]{width:100%}
.val{color:#ffb53d;font-weight:600}
.date-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.date-row button{flex:1;min-width:58px;background:#222a33;color:#e8edf2;border:1px solid #2b3340;
  border-radius:6px;padding:6px 4px;font-size:12px;cursor:pointer}
.date-row button:hover{background:#2c3640}
.date-row button.active{background:#ffb53d;color:#1a1205;border-color:#ffb53d;font-weight:700}
.readout{display:flex;gap:14px;margin-top:8px;font-variant-numeric:tabular-nums}
.readout span{font-size:11px;color:#8d99a8;display:block}
.readout b{font-size:15px}
#status{margin-top:10px;padding:8px 10px;border-radius:6px;font-size:13px;line-height:1.5;
  background:#0f141b;border:1px solid #2b3340}
#status b{font-weight:700}
.occ{color:#ff9a9a}.dir{color:#7fd4a0}
.notes{margin-top:10px;font-size:10.5px;color:#7e8a98;line-height:1.6;border-top:1px solid #2b3340;padding-top:8px}
#errMsg{color:#ff8a8a;font-size:13px;margin-top:10px}
#bid{font-size:11px;color:#9aa6b4;margin-top:6px;word-break:break-all}
.floor-section{margin-top:12px;padding-top:12px;border-top:1px solid #2b3340}
.floor-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}
.floor-heading strong{font-size:12px;color:#e8edf2}
.floor-toggle,.floor-actions button{min-height:34px;padding:6px 10px;border:1px solid #3a4654;border-radius:6px;
  background:#222a33;color:#e8edf2;font:600 12px/1.2 system-ui,"Yu Gothic",Meiryo,sans-serif;cursor:pointer}
.floor-toggle:hover,.floor-actions button:hover{background:#2c3640}
.floor-controls{margin-top:10px}
.floor-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.floor-inputs label{margin:0;color:#8d99a8}
.floor-inputs input{width:100%;min-height:38px;margin-top:4px;padding:6px 8px;border:1px solid #2b3340;
  border-radius:6px;background:#0f141b;color:#e8edf2;font-size:15px;font-variant-numeric:tabular-nums}
.floor-actions{display:flex;gap:8px;margin-top:9px}
.floor-actions button{flex:1}
.floor-actions .floor-apply{background:#ffb53d;border-color:#ffb53d;color:#1a1205}
.floor-result{min-height:1.4em;margin-top:8px;color:#ffca67;font-size:11px;line-height:1.45}
.floor-error{min-height:1.4em;margin-top:5px;color:#ff8a8a;font-size:11px}
.floor-quick,.floor-backdrop{display:none}
#compass{position:absolute;top:14px;right:14px;z-index:4;width:56px;height:56px;border-radius:50%;
  background:rgba(255,255,255,.86);border:1px solid rgba(20,28,35,.22);display:grid;place-items:center;
  color:#1b2730;font-size:11px;font-weight:700;box-shadow:0 3px 12px rgba(0,0,0,.18)}
#compassNeedle{position:absolute;width:2px;height:30px;background:#e24b34;transform-origin:50% 25px;border-radius:3px}
#compassNeedle::after{content:"";position:absolute;top:-5px;left:-4px;border-left:5px solid transparent;
  border-right:5px solid transparent;border-bottom:9px solid #e24b34}
#compass span{position:relative;z-index:1;margin-top:32px}
.dateerr{color:#ff8a8a;font-size:12px;margin-top:6px;min-height:1em}
.panel-toggle{display:none}
#mobileTimeline{display:none}
@media (max-width:600px){
  #panel{top:auto;left:0;bottom:0;width:100%;max-width:none;max-height:min(62dvh,560px);
    padding:0 16px calc(14px + env(safe-area-inset-bottom));border-width:1px 0 0;
    border-radius:16px 16px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.28);
    transition:max-height .25s ease;overscroll-behavior:contain}
  #panel.panel-collapsed{max-height:calc(90px + env(safe-area-inset-bottom));overflow:hidden}
  #panel.panel-collapsed #panelContent,#panel.panel-collapsed .panel-toggle{visibility:hidden}
  .panel-toggle{display:flex;width:100%;min-height:38px;align-items:center;justify-content:center;
    gap:8px;margin:0 0 4px;padding:0;border:0;background:transparent;color:#e8edf2;
    font:600 14px/1 system-ui,"Yu Gothic",Meiryo,sans-serif;cursor:pointer;touch-action:manipulation}
  .panel-toggle::before{content:"";position:absolute;top:6px;width:42px;height:4px;
    border-radius:4px;background:#687586}
  .panel-toggle .toggle-icon{margin-top:8px;color:#ffb53d;font-size:12px}
  #panel.panel-collapsed .toggle-icon{transform:rotate(180deg)}
  .back{display:none}
.mobile-back{
  position:fixed;
  z-index:4;
  top:calc(14px + env(safe-area-inset-top));
  right:14px;
  min-height:36px;
  display:inline-flex;
  align-items:center;
  margin:0;
  padding:0 14px;
  background:rgba(24,28,34,.9);
  border:1px solid rgba(151,166,183,.3);
  border-radius:18px;
  color:#f1f5f8;
  font-size:12px;
  font-weight:650;
  letter-spacing:.01em;
  text-decoration:none;
  white-space:nowrap;
  box-shadow:0 3px 12px rgba(0,0,0,.24);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  touch-action:manipulation;
}
  .mobile-back:hover{background:rgba(35,42,51,.94)}
  input[type=date]{min-height:44px;font-size:16px}
  input[type=range]{height:34px}
  #panelContent .time-section{display:none}
  .date-row button{min-height:44px;padding:8px;font-size:13px;touch-action:manipulation}
  .floor-toggle,.floor-actions button{min-height:44px;font-size:13px;touch-action:manipulation}
  .floor-inputs input{min-height:44px;font-size:16px}
  .readout{justify-content:space-between;padding:0 8px}
#compass{
  top:calc(62px + env(safe-area-inset-top));
  right:14px;
}
  #mobileTimeline{display:block;margin:0 -16px;padding:14px 16px 8px;background:rgba(24,28,34,.98);
    border-bottom:1px solid #394452;color:#e8edf2;cursor:ns-resize;touch-action:none;user-select:none}
  #mobileTimeline::before{content:"";display:block;width:42px;height:4px;margin:-8px auto 6px;
    border-radius:4px;background:#687586}
  #mobileTimeline .timeline-head{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;color:#9da9b7}
  #mobileTimeline strong{color:#ffb53d;font-size:18px;font-variant-numeric:tabular-nums}
  #mobileTimeline input{display:block;width:100%;height:36px;margin:1px 0 0;accent-color:#ffb53d}
}
@media (max-width:600px){
  :root{--mobile-ink:#13202a;--mobile-muted:#68737d;--mobile-accent:#f6a524;--mobile-sheet:#131920}
  #panel{max-height:min(70dvh,620px);padding:0 16px calc(14px + env(safe-area-inset-bottom));
    border-color:#303943;border-radius:12px 12px 0 0;background:rgba(19,25,32,.98);
    box-shadow:0 -10px 28px rgba(10,17,23,.24)}
  #panel.panel-collapsed{max-height:calc(128px + env(safe-area-inset-bottom))}
  .mobile-back{top:calc(16px + env(safe-area-inset-top));left:16px;right:auto;width:44px;height:44px;min-height:44px;
    display:grid;place-items:center;padding:0;border:1px solid rgba(18,32,42,.08);border-radius:10px;
    background:rgba(255,255,255,.97);color:var(--mobile-ink);box-shadow:0 4px 14px rgba(14,25,33,.18);
    backdrop-filter:blur(10px);text-decoration:none}
  .mobile-back::before{content:"←";display:block;width:auto;height:auto;border-radius:0;background:transparent;
    color:var(--mobile-ink);font:500 24px/1 system-ui,sans-serif}
  .mobile-back:hover{background:#fff}
  #compass{top:calc(16px + env(safe-area-inset-top));right:16px;width:44px;height:44px;border-radius:10px;
    border:1px solid rgba(18,32,42,.08);background:rgba(255,255,255,.97);color:var(--mobile-ink);
    box-shadow:0 4px 14px rgba(14,25,33,.18);backdrop-filter:blur(10px)}
  #compassNeedle{top:7px;left:21px;width:2px;height:22px;background:var(--mobile-ink);
    transform-origin:50% 15px;border-radius:2px}
  #compassNeedle::after{top:-3px;left:-4px;border-left-width:5px;border-right-width:5px;
    border-bottom:10px solid #df4b3f}
  #compass span{position:absolute;left:0;right:0;bottom:3px;margin:0;color:var(--mobile-muted);font-size:9px;line-height:1;text-align:center}
  .floor-quick{position:fixed;top:calc(70px + env(safe-area-inset-top));right:16px;z-index:7;width:44px;height:44px;
    display:grid;place-items:center;padding:0;border:1px solid rgba(18,32,42,.08);border-radius:10px;
    background:rgba(255,255,255,.97);color:var(--mobile-ink);box-shadow:0 4px 14px rgba(14,25,33,.18);
    backdrop-filter:blur(10px);cursor:pointer;touch-action:manipulation}
  .floor-quick:active{transform:translateY(1px)}
  .floor-quick:focus{outline:none}
  .floor-quick:focus-visible{box-shadow:0 0 0 3px rgba(246,165,36,.38),0 4px 14px rgba(14,25,33,.18)}
  .floor-quick.active{border-color:#e69616;background:var(--mobile-accent);color:#1b160d}
  .floor-quick-icon{position:relative;width:21px;height:18px;border:2px solid currentColor;border-radius:3px}
  .floor-quick-icon::before,.floor-quick-icon::after{content:"";position:absolute;left:3px;right:3px;height:2px;
    border-radius:2px;background:currentColor}
  .floor-quick-icon::before{top:4px}
  .floor-quick-icon::after{bottom:4px}
  .floor-quick-badge{position:absolute;right:-6px;bottom:-7px;min-width:25px;height:17px;padding:0 4px;
    display:grid;place-items:center;border:2px solid #fff;border-radius:9px;background:#202832;color:#fff;
    font-size:9px;font-weight:750;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
  .floor-quick-badge[hidden]{display:none}
  .floor-backdrop{position:fixed;inset:0;z-index:9;display:block;background:rgba(8,13,18,.16)}
  .floor-backdrop[hidden]{display:none}
  body>#floorSection{position:fixed;left:0;right:0;bottom:0;z-index:10;display:block;margin:0;
    max-height:min(54dvh,390px);padding:18px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto;
    border:1px solid #303943;border-width:1px 0 0;border-radius:12px 12px 0 0;
    background:rgba(19,25,32,.99);box-shadow:0 -10px 32px rgba(10,17,23,.28);overscroll-behavior:contain}
  body>#floorSection[hidden]{display:none}
  body>#floorSection:focus{outline:none}
  body>#floorSection .floor-heading strong{font-size:16px}
  body>#floorSection .floor-toggle{position:relative;width:40px;height:40px;min-height:40px;padding:0;
    border:0;background:#202832;color:transparent;font-size:0}
  body>#floorSection .floor-toggle::before,body>#floorSection .floor-toggle::after{content:"";position:absolute;
    top:19px;left:11px;width:18px;height:2px;border-radius:2px;background:#dbe2e8}
  body>#floorSection .floor-toggle::before{transform:rotate(45deg)}
  body>#floorSection .floor-toggle::after{transform:rotate(-45deg)}
  body>#floorSection .floor-controls{margin-top:14px}
  body>#floorSection .floor-inputs{gap:10px}
  body>#floorSection .floor-actions{margin-top:12px}
  body>#floorSection .floor-result{font-size:12px}
  body>#floorSection .notes{margin-top:8px;padding-top:8px}
  #mobileTimeline{height:128px;margin:0 -16px;padding:17px 16px 12px;border:0;
    background:var(--mobile-sheet);cursor:ns-resize}
  #mobileTimeline::before{width:42px;height:4px;margin:-10px auto 10px;background:#74808d}
  #mobileTimeline .timeline-head{height:38px;align-items:center;color:#9ca7b1}
  #mobileTimeline strong{color:var(--mobile-accent);font-size:22px;line-height:1}
  #mobileTimeline .timeline-date{font-size:11px;font-weight:600}
  .sheet-toggle{position:relative;width:36px;height:36px;padding:0;border:0;border-radius:8px;
    background:#202832;color:transparent;cursor:pointer}
  .sheet-toggle::before,.sheet-toggle::after{content:"";position:absolute;top:17px;width:9px;height:2px;
    border-radius:2px;background:#c7cfd6}
  .sheet-toggle::before{left:10px;transform:rotate(-45deg)}
  .sheet-toggle::after{right:10px;transform:rotate(45deg)}
  #panel:not(.panel-collapsed) .sheet-toggle::before{transform:rotate(45deg)}
  #panel:not(.panel-collapsed) .sheet-toggle::after{transform:rotate(-45deg)}
  #mobileTimeline input{-webkit-appearance:none;appearance:none;height:34px;margin:4px 0 0;background:transparent}
  #mobileTimeline input::-webkit-slider-runnable-track{height:4px;border-radius:4px;
    background:linear-gradient(to right,var(--mobile-accent) 0,var(--mobile-accent) var(--range-pct,50%),#515a64 var(--range-pct,50%),#515a64 100%)}
  #mobileTimeline input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;
    border:0;border-radius:50%;background:var(--mobile-accent);box-shadow:0 1px 4px rgba(0,0,0,.2)}
  #mobileTimeline input::-moz-range-track{height:4px;border-radius:4px;background:#515a64}
  #mobileTimeline input::-moz-range-progress{height:4px;border-radius:4px;background:var(--mobile-accent)}
  #mobileTimeline input::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--mobile-accent)}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="compass" title="北方向"><div id="compassNeedle"></div><span>N</span></div>
<button id="floorQuick" class="floor-quick" type="button" aria-label="階別表示を設定" aria-controls="floorSection" aria-expanded="false">
  <span class="floor-quick-icon" aria-hidden="true"></span><span id="floorQuickBadge" class="floor-quick-badge" hidden></span>
</button>
<div id="floorBackdrop" class="floor-backdrop" hidden></div>
<a class="mobile-back" href="index.html?restore=1" aria-label="地図に戻る"></a>
<div id="panel">
  <div id="mobileTimeline" aria-label="時刻設定">
    <div class="timeline-head"><span class="timeline-date">日照シミュレーション</span><strong id="mobileTimeLabel">12:00</strong><button id="mobileSheetToggle" class="sheet-toggle" type="button" aria-label="設定を開閉"></button></div>
    <input type="range" id="mobileTime" min="0" max="24" step="0.25" value="12" aria-label="時刻" />
  </div>
  <button id="panelToggle" class="panel-toggle" type="button" aria-expanded="true" aria-controls="panelContent">
    <span>日照設定・判定結果</span><span class="toggle-icon" aria-hidden="true">▼</span>
  </button>
  <div id="panelContent">
  <a class="back" href="index.html?restore=1">← 地図に戻る</a>
  <h1>詳細3Dモード</h1>
  <p class="sub">選択した建物周辺の光と遮蔽を確認</p>

  <label>日付</label>
  <div id="dateBtns">
    <div class="date-row">
      <button data-mo="3" data-d="20">春分</button>
      <button data-mo="6" data-d="21">夏至</button>
      <button data-mo="9" data-d="23">秋分</button>
      <button data-mo="12" data-d="22">冬至</button>
    </div>
    <div class="date-row">
      <button data-preset="today">今日</button>
      <button data-preset="custom">カスタム</button>
    </div>
  </div>
  <input type="date" id="date" style="display:none" />
  <div id="dateErr" class="dateerr"></div>

  <div class="time-section"><label for="time">時刻 <span class="val" id="timeLabel">12:00</span></label>
  <input type="range" id="time" min="0" max="24" step="0.25" value="12" />

  <div class="readout">
    <div><span>太陽高度角</span><b id="alt">–</b></div>
    <div><span>太陽方位角</span><b id="az">–</b></div>
  </div>
  </div>
  <div id="status">読み込み中…</div>
  <div id="bid"></div>
  <div id="errMsg"></div>
  <div id="floorHome">
  <section id="floorSection" class="floor-section" aria-labelledby="floorHeading" tabindex="-1">
    <div class="floor-heading">
      <strong id="floorHeading">階別の日当たり</strong>
      <button id="floorToggle" class="floor-toggle" type="button" aria-expanded="false" aria-controls="floorControls">階別表示を設定</button>
    </div>
    <div id="floorControls" class="floor-controls" hidden>
      <div class="floor-inputs">
        <label for="totalFloors">建物の総階数
          <input id="totalFloors" type="number" min="1" max="200" step="1" inputmode="numeric" placeholder="例: 20" />
        </label>
        <label for="targetFloor">確認する階
          <input id="targetFloor" type="number" min="1" max="200" step="1" inputmode="numeric" placeholder="例: 7" />
        </label>
      </div>
      <div class="floor-actions">
        <button id="floorApply" class="floor-apply" type="button">この階を表示</button>
        <button id="floorClear" type="button">解除</button>
      </div>
      <div id="floorResult" class="floor-result" aria-live="polite"></div>
      <div id="floorError" class="floor-error" aria-live="polite"></div>
    </div>
    <div class="notes">
      ※ 階別表示は建物の高さを総階数で等分した推定です。実際の階高、住戸位置、窓の方向は反映していません。
    </div>
  </section>
  </div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   detail.html — Three.js 詳細3Dモード
   同じ GeoJSON を読み、対象建物と近隣の建物を3Dで表示し、
   太陽方向の光照/遮蔽を可視化。
   ========================================================= */
const DEFAULT_LOCATION = { lat: 35.6590, lng: 139.8770 };
const BASE_NEIGHBOR_RADIUS = 200; // m
const PROBE_RADIUS = 280; // m
const MAX_NEIGHBOR_RADIUS = 520; // m
const MAX_VISIBLE_NEIGHBORS = 1400;
const DEG_LAT = 110540;
let sunOrigin = DEFAULT_LOCATION;

const el = id => document.getElementById(id);
const dateInput = el("date"), dateBtns = el("dateBtns"), dateErr = el("dateErr");
const timeInput = el("time"), timeLabel = el("timeLabel");
const altOut = el("alt"), azOut = el("az");
const statusEl = el("status"), errMsg = el("errMsg"), bidEl = el("bid");
const compassNeedle = el("compassNeedle");
const panel = el("panel"), panelToggle = el("panelToggle");
const mobileTime = el("mobileTime"), mobileTimeLabel = el("mobileTimeLabel");
const mobileTimeline = el("mobileTimeline"), mobileSheetToggle = el("mobileSheetToggle");
const floorQuick = el("floorQuick"), floorQuickBadge = el("floorQuickBadge");
const floorBackdrop = el("floorBackdrop"), floorHome = el("floorHome"), floorSection = el("floorSection");
const floorToggle = el("floorToggle"), floorControls = el("floorControls");
const totalFloorsInput = el("totalFloors"), targetFloorInput = el("targetFloor");
const floorApply = el("floorApply"), floorClear = el("floorClear");
const floorResult = el("floorResult"), floorError = el("floorError");
function syncMobileRangeFill(){
  const min=Number(mobileTime.min)||0, max=Number(mobileTime.max)||24, value=Number(mobileTime.value)||0;
  mobileTime.style.setProperty("--range-pct",`${((value-min)/(max-min))*100}%`);
}

function setPanelCollapsed(collapsed){
  panel.classList.toggle("panel-collapsed",collapsed);
  panelToggle.setAttribute("aria-expanded",String(!collapsed));
}

const mobileLayout = matchMedia("(max-width: 600px)");
function setFloorControlsOpen(open){
  floorControls.hidden=!open;

// 座標変換: lng/lat → ローカル(m)
function toLocal(lng, lat, ref) {
  const DEG_LNG = 111320 * Math.cos(ref[1] * Math.PI / 180);
  return [(lng - ref[0]) * DEG_LNG, (lat - ref[1]) * DEG_LAT];
}
function dist2d(a, b) {
  const DEG_LNG = 111320 * Math.cos(b[1] * Math.PI / 180);
  const dx = (a[0]-b[0])*DEG_LNG, dy = (a[1]-b[1])*DEG_LAT;
  return Math.sqrt(dx*dx+dy*dy);
}
function centroid(ring) {
  let sx=0,sy=0; const n=ring.length-1;
  for(let i=0;i<n;i++){sx+=ring[i][0];sy+=ring[i][1];}
  return [sx/n, sy/n];
}
function footprintRadius(ring, center) {
  let radius=0;
  for(const point of ring) radius=Math.max(radius,dist2d(point,center));
  return radius;
}
function distanceToFootprint(feature, point) {
  const ring=feature.geometry.coordinates[0];
  const center=centroid(ring);
  return Math.max(0,dist2d(center,point)-footprintRadius(ring,center));
}
function boxAround(point, radius) {
  const lngScale=111320*Math.cos(point[1]*Math.PI/180);
  return [point[0]-radius/lngScale,point[1]-radius/DEG_LAT,point[0]+radius/lngScale,point[1]+radius/DEG_LAT];
}
function boxesIntersect(a,b){return !(a[2]<b[0]||a[0]>b[2]||a[3]<b[1]||a[1]>b[3]);}

const GEOJSON_CACHE = new Map();
let tileCatalogPromise = null;
async function loadTileCatalog(){
  if(!tileCatalogPromise){
    tileCatalogPromise=fetch("./data/tile-datasets.json",{cache:"no-cache"})
      .then(r=>r.ok?r.json():null).catch(()=>null);
  }
  return tileCatalogPromise;
}
async function fetchFeatureCollection(url){
  if(GEOJSON_CACHE.has(url)) return GEOJSON_CACHE.get(url);
  const promise=fetch(url,{cache:"no-cache"}).then(r=>{
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  });
  GEOJSON_CACHE.set(url,promise);
  try{
    const data=await promise;
    GEOJSON_CACHE.set(url,data);
    return data;
  }catch(e){
    GEOJSON_CACHE.delete(url);
    throw e;
  }
}
function featureKey(feature,index){
  const p=feature.properties||{};
  if(p.gml_id) return "gml:"+p.gml_id;
  const ring=feature.geometry&&feature.geometry.coordinates&&feature.geometry.coordinates[0];
  const first=ring&&ring[0];
  return first ? `shape:${first[0].toFixed(7)},${first[1].toFixed(7)},${Number(p.height)||0}` : "index:"+index;
}
async function loadFeaturesAround(center,radius,seedCollection){
  const catalog=await loadTileCatalog();
  const urls=[];
  const viewBox=boxAround(center,radius);
  if(catalog&&Array.isArray(catalog.datasets)){
    for(const dataset of catalog.datasets){
      if(!boxesIntersect(viewBox,dataset.bbox)) continue;
      for(const tile of dataset.tiles||[]){
        if(boxesIntersect(viewBox,tile.bbox)) urls.push(tile.geojson_path);
      }
    }
  }
  const collections=[seedCollection];
  const loaded=await Promise.allSettled([...new Set(urls)].map(fetchFeatureCollection));
  for(const result of loaded) if(result.status==="fulfilled") collections.push(result.value);
  const unique=new Map();
  let index=0;
  for(const collection of collections){
    for(const feature of collection&&collection.features||[]){
      unique.set(featureKey(feature,index++),feature);
    }
  }
  return [...unique.values()];
}
function chooseNeighborRadius(targetHeight,targetRing,targetCenter,features){
  const targetDiameter=footprintRadius(targetRing,targetCenter)*2;
  let maxHeight=targetHeight,tallCount=0;
  for(const feature of features){
    if(distanceToFootprint(feature,targetCenter)>PROBE_RADIUS) continue;
    const height=Number(feature.properties&&feature.properties.height)||3;
    maxHeight=Math.max(maxHeight,height);
    if(height>=60) tallCount++;
  }
  let radius=BASE_NEIGHBOR_RADIUS;
  if(targetHeight>=50||targetDiameter>=55||tallCount>=2) radius=280;
  if(targetHeight>=90||maxHeight>=110||tallCount>=4) radius=380;
  if(targetHeight>=160||maxHeight>=180||tallCount>=9) radius=480;
  const heightInfluence=Math.max(targetHeight,maxHeight)*1.9+targetDiameter*0.5;
  return Math.round(Math.min(MAX_NEIGHBOR_RADIUS,Math.max(radius,heightInfluence))/20)*20;
}
function normalizeLod2SurfaceRings(surface){
  if(!Array.isArray(surface) || !surface.length) return [];
  const first = surface[0];
  if(Array.isArray(first) && typeof first[0] === "number") return [surface];
  return surface.filter(ring => Array.isArray(ring) && ring.length);
}
function lod2Footprint(data){
  const pts = [];
  for(const surface of data.surfaces || []){
    for(const ring of normalizeLod2SurfaceRings(surface)){
      for(const p of ring){
        if(Array.isArray(p) && Number.isFinite(p[0]) && Number.isFinite(p[1])) pts.push([p[0], p[1]]);
      }
    }
  }
  pts.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  if(pts.length<3) return null;
  const cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];
  for(const p of pts){while(lo.length>=2&&cross(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  for(let i=pts.length-1;i>=0;i--){const p=pts[i];while(up.length>=2&&cross(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
  lo.pop();up.pop();const h=lo.concat(up);h.push(h[0]);return h;
}
function lod2GeometryHeight(data){
  return Math.max(
    Number(data && data.height) || 0,
    Math.max(0, (data && data.bbox && data.bbox[5] - data.bbox[2]) || 0)
  );
}
const LOD2_DATA_CACHE = new Map();
async function lod2UrlForBuilding(gmlId, allowUrlParam=true){
  if(allowUrlParam && lod2UrlParam) return lod2UrlParam;
  if(BUILTIN_LOD2_URLS[gmlId]) return BUILTIN_LOD2_URLS[gmlId];

}
async function loadLod2Data(gmlId, allowUrlParam=true){

const MAT_TARGET = new THREE.MeshStandardMaterial({ color: 0xff9933, side: THREE.DoubleSide });
const MAT_NEIGHBOR = new THREE.MeshStandardMaterial({ color: 0x999999, transparent: true, opacity: 0.7, side: THREE.DoubleSide });
const MAT_FLOOR = new THREE.MeshStandardMaterial({
  color:0xffd24a,emissive:0x8a4b00,emissiveIntensity:0.28,transparent:true,opacity:0.88,
  side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2

function buildMesh(feature, ref, material) {
  const ring = feature.geometry.coordinates[0];
  const h = Number(feature.properties.height) || 3;
  const pts = ring.map(c => toLocal(c[0], c[1], ref));
  const shape = new THREE.Shape();
  shape.moveTo(pts[0][0], pts[0][1]);
  for (let i=1; i<pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
  const geom = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false });
  const mesh = new THREE.Mesh(geom, material);
  mesh.rotation.x = -Math.PI/2;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function buildFloorBand(ring,ref,low,high){
  const pts=ring.map(c=>toLocal(c[0],c[1],ref));
  const shape=new THREE.Shape();
  shape.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) shape.lineTo(pts[i][0],pts[i][1]);
  const geom=new THREE.ExtrudeGeometry(shape,{depth:Math.max(0.2,high-low),bevelEnabled:false});
  const group=new THREE.Group();
  const mesh=new THREE.Mesh(geom,MAT_FLOOR);
  mesh.rotation.x=-Math.PI/2;
  mesh.castShadow=false;
  mesh.receiveShadow=true;
  group.add(mesh);
  const lines=new THREE.LineSegments(
    new THREE.EdgesGeometry(geom,20),
    new THREE.LineBasicMaterial({color:0xfff2a8,transparent:true,opacity:0.95})
  );
  lines.rotation.x=-Math.PI/2;
  group.add(lines);
  group.position.y=low;
  group.scale.set(1.012,1,1.012);
  return group;
}
function buildLod2Mesh(data, ref, material, lineColor=0x755e48) {
  const vertices = [];
  const indices = [];
  const lineVertices = [];
  const groundElevation = Number(data.ground_elevation ?? (data.bbox && data.bbox[2])) || 0;
  const localHeight = p => Math.max(0, (Number(p[2]) || groundElevation) - groundElevation);
  for(const surface of data.surfaces || []){
    for(const ring of normalizeLod2SurfaceRings(surface)){
      const clean = ring.filter(p => Array.isArray(p) && p.length >= 3).slice();
      if(clean.length > 1){
        const a = clean[0], b = clean[clean.length - 1];
        if(Math.abs(a[0]-b[0]) < 1e-10 && Math.abs(a[1]-b[1]) < 1e-10 && Math.abs((a[2]||0)-(b[2]||0)) < 1e-6) clean.pop();
      }
      if(clean.length < 3) continue;
      const base = vertices.length / 3;
      for(const p of clean){
        const [x, y] = toLocal(p[0], p[1], ref);
        vertices.push(x, localHeight(p), -y);
      }
      for(let i=1; i<clean.length-1; i++) indices.push(base, base+i, base+i+1);
      for(let i=0; i<clean.length; i++){
        const a = clean[i], b = clean[(i+1)%clean.length];
        const [ax, ay] = toLocal(a[0], a[1], ref);
        const [bx, by] = toLocal(b[0], b[1], ref);
        lineVertices.push(ax, localHeight(a), -ay, bx, localHeight(b), -by);
      }
    }
  }
  const group = new THREE.Group();
  const geom = new THREE.BufferGeometry();
  geom.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  const mesh = new THREE.Mesh(geom, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  group.add(mesh);

  const lineGeom = new THREE.BufferGeometry();
  lineGeom.setAttribute("position", new THREE.Float32BufferAttribute(lineVertices, 3));
  const lines = new THREE.LineSegments(lineGeom, new THREE.LineBasicMaterial({
    color: lineColor,
    transparent: true,
    opacity: 0.28
  }));
  group.add(lines);
  return group;
}
function frameLod2Target(height, targetX=0, targetZ=0){
  const h = Math.max(3, Number(height) || 3);
  const distance = Math.max(_entryDistance, h * 1.48);
  const targetY = h * 0.44;
  const horiz = distance * Math.cos(_entryElev);
  controls.target.set(targetX, targetY, targetZ);
  camera.position.set(
    targetX + horiz * Math.sin(_entryBearing),
    targetY + distance * Math.sin(_entryElev),
    targetZ + horiz * Math.cos(_entryBearing)
  );
  camera.near = Math.max(0.5, distance / 1000);
  camera.far = Math.max(3000, distance * 4);
  camera.updateProjectionMatrix();
  controls.update();
}
function frameSceneContext(height,radius,targetX=0,targetZ=0){
  const h=Math.max(3,Number(height)||3);
  const contextDistance=radius>BASE_NEIGHBOR_RADIUS ? radius*1.05 : 0;
  const distance=Math.max(_entryDistance,h*1.9,contextDistance);
  const targetY=h*0.38;
  const horiz=distance*Math.cos(_entryElev);
  controls.target.set(targetX,targetY,targetZ);
  camera.position.set(
    targetX+horiz*Math.sin(_entryBearing),
    targetY+distance*Math.sin(_entryElev),
    targetZ+horiz*Math.cos(_entryBearing)
  );
  camera.near=Math.max(0.5,distance/1000);
  camera.far=Math.max(3000,distance*4);
  camera.updateProjectionMatrix();
  controls.update();
}

  }
  const total=Number(totalFloorsInput.value),floor=Number(targetFloorInput.value);
  if(!Number.isInteger(total)||total<1||total>200){
    floorError.textContent="総階数は1〜200の整数で入力してください。";
    return false;
  }
  if(!Number.isInteger(floor)||floor<1||floor>total){
    floorError.textContent=`確認する階は1〜${total}階の範囲で入力してください。`;
    return false;
  }
  targetFloorInput.max=String(total);
  const floorHeight=targetHeight/total;
  const low=floorHeight*(floor-1),high=floorHeight*floor;
  removeFloorHighlight();
  floorHighlight=buildFloorBand(targetRingForFloor,targetRefForFloor,low,high);
  scene.add(floorHighlight);
  floorSelection={total,floor,low,high,mid:(low+high)/2};
  floorResult.textContent=`${floor}階を表示中（推定高さ ${low.toFixed(1)}〜${high.toFixed(1)}m）`;
  syncFloorQuickState();
  updateSun();
  return true;
}
floorToggle.addEventListener("click",()=>{
  if(mobileLayout.matches){
    closeMobileFloorPanel({restoreFocus:true});
    return;
  }
  const open=floorControls.hidden;
  setFloorControlsOpen(open);
  if(open) totalFloorsInput.focus();
});
floorQuick.addEventListener("click",()=>{
  if(floorSection.classList.contains("mobile-open")) closeMobileFloorPanel({restoreFocus:true});
  else openMobileFloorPanel();
});
floorBackdrop.addEventListener("click",()=>closeMobileFloorPanel({restoreFocus:true}));
document.addEventListener("keydown",event=>{
  if(event.key==="Escape"&&floorSection.classList.contains("mobile-open")) closeMobileFloorPanel({restoreFocus:true});
});
floorApply.addEventListener("click",()=>{
  if(applyFloorSelection()&&mobileLayout.matches) closeMobileFloorPanel({restoreFocus:true});
});
floorClear.addEventListener("click",()=>{
  clearFloorSelection();
  if(mobileLayout.matches) closeMobileFloorPanel({restoreFocus:true});
});
[totalFloorsInput,targetFloorInput].forEach(input=>input.addEventListener("keydown",event=>{
  if(event.key==="Enter"&&applyFloorSelection()&&mobileLayout.matches) closeMobileFloorPanel({restoreFocus:true});
}));

// === データ読み込み & シーン構築 ===
let targetFeature = null;
let neighbors = [];   // { feature, cx, cy } in local meters

async function init() {
  let fc;
  try {
    fc = await fetchFeatureCollection(geojsonUrl);
  } catch(e) {
    errMsg.textContent = "GeoJSON 読み込み失敗: " + e;
    statusEl.textContent = "データエラー";
    return;
  }

  const lod2Data = await loadLod2Data(buildingId);
  const targetBuildingId = (lod2Data && lod2Data.gml_id) || buildingId;

  // 対象建物を探す
  // 安定IDを優先(gml_id)。暫定で index- プレフィックスにも対応。
  // ※ 将来は安定IDに統一すること
  if (targetBuildingId.startsWith("index-")) {
    const idx = parseInt(targetBuildingId.replace("index-",""), 10);
    targetFeature = fc.features[idx] || null;
  } else {
    targetFeature = fc.features.find(f => f.properties.gml_id === targetBuildingId) || null;
  }
  if (!targetFeature) {
    errMsg.textContent = "建物が見つかりません: " + buildingId;
    statusEl.textContent = "対象建物なし";
    return;
  }

  const lod2Ring = lod2Data ? lod2Footprint(lod2Data) : null;
  const tgtRing = lod2Ring || targetFeature.geometry.coordinates[0];
  const tgtC = centroid(tgtRing); // [lng, lat]
  const ref = tgtC; // ローカル座標の原点
  const tgtH = Number((lod2Data && lod2GeometryHeight(lod2Data)) || targetFeature.properties.height)||3;
  targetRingForFloor=tgtRing;
  targetRefForFloor=ref;
  targetHeight=tgtH;
  targetFootprintRadius=footprintRadius(tgtRing,tgtC);
  sunOrigin={lng:tgtC[0],lat:tgtC[1]};
  const estimatedFloors=Math.max(1,Math.round(tgtH/3));
  totalFloorsInput.placeholder=`目安: ${estimatedFloors}`;
  targetFloorInput.max=String(estimatedFloors);

  // 対象建物は先に表示し、周辺データは背景で読み込む。
  scene.add(lod2Data
    ? buildLod2Mesh(lod2Data,ref,MAT_TARGET)
    : buildMesh(targetFeature,ref,MAT_TARGET));
  frameSceneContext(tgtH,BASE_NEIGHBOR_RADIUS);
  updateSun();

  statusEl.textContent="周辺建物の影響範囲を解析中…";
  let sceneFeatures;
  try{
    const probeFeatures=await loadFeaturesAround(tgtC,PROBE_RADIUS,fc);
    const adaptiveRadius=chooseNeighborRadius(tgtH,tgtRing,tgtC,probeFeatures);
    sceneFeatures=adaptiveRadius>PROBE_RADIUS
      ? await loadFeaturesAround(tgtC,adaptiveRadius,fc)
      : probeFeatures;
    updateSceneBounds(adaptiveRadius);
  }catch(e){
    sceneFeatures=fc.features||[];
    updateSceneBounds(BASE_NEIGHBOR_RADIUS);
  }

  // 周辺建物（建物高さと周辺密度から自動調整）
  let tallestNeighborLod2 = null;
  const neighborCandidates=[];
  for(const f of sceneFeatures){
    if(f===targetFeature||(targetBuildingId&&f.properties.gml_id===targetBuildingId)) continue;
    const edgeDistance=distanceToFootprint(f,tgtC);
    if(edgeDistance>sceneRadius) continue;
    const c = centroid(f.geometry.coordinates[0]);
    neighborCandidates.push({feature:f,center:c,edgeDistance});
  }
  neighborCandidates.sort((a,b)=>a.edgeDistance-b.edgeDistance);
  for (const candidate of neighborCandidates.slice(0,MAX_VISIBLE_NEIGHBORS)) {
    const f=candidate.feature,c=candidate.center;
    const [lx, ly] = toLocal(c[0], c[1], ref);
    const neighborGmlId = f.properties && f.properties.gml_id;
    const neighborLod2 = BUILTIN_LOD2_URLS[neighborGmlId]
      ? await loadLod2Data(neighborGmlId, false)
      : null;
    const neighborHeight = neighborLod2
      ? lod2GeometryHeight(neighborLod2)
      : Number(f.properties.height) || 3;
    if(neighborLod2 && (!tallestNeighborLod2 || neighborHeight > tallestNeighborLod2.height)){
      tallestNeighborLod2 = { height:neighborHeight, x:lx, z:-ly };
    }
    neighbors.push({
      feature:f,cx:lx,cy:ly,height:neighborHeight,
      footprintRadius:footprintRadius(f.geometry.coordinates[0],c)
    });
    scene.add(neighborLod2
      ? buildLod2Mesh(neighborLod2, ref, MAT_NEIGHBOR, 0x666666)
      : buildMesh(f, ref, MAT_NEIGHBOR));
  }
  const frameHeight=Math.max(tgtH,tallestNeighborLod2?tallestNeighborLod2.height:0);
  const frameX=tallestNeighborLod2?tallestNeighborLod2.x*0.35:0;
  const frameZ=tallestNeighborLod2?tallestNeighborLod2.z*0.35:0;
  frameSceneContext(frameHeight,sceneRadius,frameX,frameZ);

  bidEl.textContent = `高さ: ${tgtH.toFixed(1)}m　周辺: ${neighbors.length}棟　表示範囲: ${sceneRadius}m${lod2Data ? "　PLATEAU LOD2" : ""}`;
  updateSun();
}

// === 太陽位置 & 遮蔽判定 ===
function getSun() {
  const [y,mo,d] = dateInput.value.split("-").map(Number);
  const v = parseFloat(timeInput.value);
  const hh = Math.floor(v), mi = Math.round((v-hh)*60);
  const dt = new Date(Date.UTC(y, mo-1, d, hh-9, mi));
  const p = SunCalc.getPosition(dt, sunOrigin.lat, sunOrigin.lng);
  const altDeg = p.altitude * 180 / Math.PI;
  const sunBearing = (p.azimuth * 180 / Math.PI + 180 + 360) % 360;
  return { altDeg, sunBearing };
}

function updateSun() {
  const sun = getSun();
  altOut.textContent = sun.altDeg.toFixed(1) + "°";
  azOut.textContent = sun.sunBearing.toFixed(0) + "°";

  // DirectionalLight の位置を太陽方向にセット
  const R = Math.max(400,sceneRadius*2);
  const azRad = sun.sunBearing * Math.PI / 180;
  const altRad = Math.max(0, sun.altDeg) * Math.PI / 180;
  sunLight.position.set(
    R * Math.sin(azRad) * Math.cos(altRad),
    R * Math.sin(altRad),
    -R * Math.cos(azRad) * Math.cos(altRad)
  );
  sunLight.intensity = sun.altDeg > 0 ? 1.0 : 0.05;
  ambient.intensity = sun.altDeg > 0 ? 0.4 : 0.15;

  if (sun.altDeg <= 0) {
    statusEl.innerHTML = "太陽は地平線下です。日照判定はできません。";
    return;
  }
  if (!targetFeature) return;

  // 遮蔽判定: 周辺建物が太陽方向にあり、影が対象に届くか
  const shadowAz = (sun.sunBearing + 180) % 360;
  const shadowAzRad = shadowAz * Math.PI / 180;
  const sdx = Math.sin(shadowAzRad), sdy = Math.cos(shadowAzRad);
  const tanAlt = Math.tan(altRad);
  const referenceHeight=floorSelection?floorSelection.mid:0;

  let occluders = [];
  for (const nb of neighbors) {
    const dx = -nb.cx, dy = -nb.cy; // neighbor→target
    const along = dx*sdx + dy*sdy;
    const perp = Math.abs(dx*sdy - dy*sdx);
    const effectiveHeight=Math.max(0,nb.height-referenceHeight);
    const shadowLen = effectiveHeight / tanAlt;
    const influenceWidth=Math.max(20,targetFootprintRadius)+(nb.footprintRadius||0);
    if (effectiveHeight>0 && along > 0 && along < shadowLen && perp < influenceWidth) {
      const azToNb = (Math.atan2(nb.cx, nb.cy) * 180 / Math.PI + 360) % 360;
      occluders.push({ dir: dirName(azToNb), h: nb.height, dist: Math.sqrt(nb.cx*nb.cx+nb.cy*nb.cy) });
    }
  }

  if (occluders.length > 0) {
    const top = occluders.sort((a,b)=>b.h-a.h)[0];
    const heading=floorSelection?`${floorSelection.floor}階は遮られる可能性あり`:"遮蔽物あり";
    statusEl.innerHTML = `<b class="occ">${heading}</b>　${top.dir}方向に高さ${top.h.toFixed(0)}mの建物（約${top.dist.toFixed(0)}m先）<br>`
      + `計${occluders.length}棟が太陽方向に位置しています`;
  } else {
    const heading=floorSelection?`${floorSelection.floor}階は日が当たる可能性あり`:"直射の可能性あり";
    statusEl.innerHTML = `<b class="dir">${heading}</b>　現在の太陽方向（${dirName(sun.sunBearing)}・高度${sun.altDeg.toFixed(0)}°）に`
      + `遮蔽となる建物は見当たりません`;
  }
}

timeInput.addEventListener("input", () => {
  timeLabel.textContent = fmtTime(parseFloat(timeInput.value));
  mobileTime.value = timeInput.value;
  syncMobileRangeFill();
  mobileTimeLabel.textContent = timeLabel.textContent;
  updateSun();
});
mobileTime.addEventListener("input", () => {
  timeInput.value = mobileTime.value;
  timeLabel.textContent = mobileTimeLabel.textContent = fmtTime(parseFloat(mobileTime.value));
  syncMobileRangeFill();
  updateSun();
});

// リサイズ対応
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// アニメーションループ
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  const dx = camera.position.x - controls.target.x;
  const dz = camera.position.z - controls.target.z;
  const angle = Math.atan2(dx, dz) * 180 / Math.PI;
  compassNeedle.style.transform = `rotate(${angle}deg)`;
  renderer.render(scene, camera);
}
animate();
init();
</script>
