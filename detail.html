<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>詳細3Dモード — 東京 日当たりマップ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/"

</script>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;font-family:system-ui,"Yu Gothic",Meiryo,sans-serif}
#c{position:absolute;inset:0}
#panel{position:absolute;top:10px;left:10px;z-index:5;width:300px;max-width:calc(100% - 20px);
  background:rgba(24,28,34,.94);color:#e8edf2;border:1px solid #2b3340;border-radius:10px;
  padding:14px;max-height:calc(100% - 20px);overflow:auto}
h1{font-size:14px;margin:0 0 4px}
.sub{font-size:11px;color:#8d99a8;margin:0 0 10px}
.back{display:inline-block;margin-bottom:8px;padding:6px 12px;background:#222a33;color:#e8edf2;
  border:1px solid #2b3340;border-radius:6px;text-decoration:none;font-size:13px}
.back:hover{background:#2c3640}
.mobile-back{display:none}
label{display:block;font-size:12px;color:#8d99a8;margin:10px 0 4px}
input[type=date]{width:100%;background:#0f141b;border:1px solid #2b3340;color:#e8edf2;border-radius:6px;padding:6px 8px}
input[type=range]{width:100%}
.val{color:#ffb53d;font-weight:600}
.date-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.date-row button{flex:1;min-width:58px;background:#222a33;color:#e8edf2;border:1px solid #2b3340;
  border-radius:6px;padding:6px 4px;font-size:12px;cursor:pointer}
.date-row button:hover{background:#2c3640}
.date-row button.active{background:#ffb53d;color:#1a1205;border-color:#ffb53d;font-weight:700}
.readout{display:flex;gap:14px;margin-top:8px;font-variant-numeric:tabular-nums}
.readout span{font-size:11px;color:#8d99a8;display:block}
.readout b{font-size:15px}
#status{margin-top:10px;padding:8px 10px;border-radius:6px;font-size:13px;line-height:1.5;
  background:#0f141b;border:1px solid #2b3340}
#status b{font-weight:700}
.occ{color:#ff9a9a}.dir{color:#7fd4a0}
.notes{margin-top:10px;font-size:10.5px;color:#7e8a98;line-height:1.6;border-top:1px solid #2b3340;padding-top:8px}
#errMsg{color:#ff8a8a;font-size:13px;margin-top:10px}
#bid{font-size:11px;color:#9aa6b4;margin-top:6px;word-break:break-all}
#compass{position:absolute;top:14px;right:14px;z-index:4;width:56px;height:56px;border-radius:50%;
  background:rgba(255,255,255,.86);border:1px solid rgba(20,28,35,.22);display:grid;place-items:center;
  color:#1b2730;font-size:11px;font-weight:700;box-shadow:0 3px 12px rgba(0,0,0,.18)}
#compassNeedle{position:absolute;width:2px;height:30px;background:#e24b34;transform-origin:50% 25px;border-radius:3px}
#compassNeedle::after{content:"";position:absolute;top:-5px;left:-4px;border-left:5px solid transparent;
  border-right:5px solid transparent;border-bottom:9px solid #e24b34}
#compass span{position:relative;z-index:1;margin-top:32px}
.dateerr{color:#ff8a8a;font-size:12px;margin-top:6px;min-height:1em}
.panel-toggle{display:none}
#mobileTimeline{display:none}
@media (max-width:600px){
  #panel{top:auto;left:0;bottom:0;width:100%;max-width:none;max-height:min(62dvh,560px);
    padding:0 16px calc(14px + env(safe-area-inset-bottom));border-width:1px 0 0;
    border-radius:16px 16px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.28);
    transition:max-height .25s ease;overscroll-behavior:contain}
  #panel.panel-collapsed{max-height:calc(90px + env(safe-area-inset-bottom));overflow:hidden}
  #panel.panel-collapsed #panelContent,#panel.panel-collapsed .panel-toggle{visibility:hidden}
  .panel-toggle{display:flex;width:100%;min-height:38px;align-items:center;justify-content:center;
    gap:8px;margin:0 0 4px;padding:0;border:0;background:transparent;color:#e8edf2;
    font:600 14px/1 system-ui,"Yu Gothic",Meiryo,sans-serif;cursor:pointer;touch-action:manipulation}
  .panel-toggle::before{content:"";position:absolute;top:6px;width:42px;height:4px;
    border-radius:4px;background:#687586}
  .panel-toggle .toggle-icon{margin-top:8px;color:#ffb53d;font-size:12px}
  #panel.panel-collapsed .toggle-icon{transform:rotate(180deg)}
  .back{display:none}
  .mobile-back{position:fixed;z-index:4;top:calc(14px + env(safe-area-inset-top));right:14px;
    min-height:36px;display:inline-flex;align-items:center;margin:0;padding:0 14px;
    background:rgba(24,28,34,.9);border:1px solid rgba(151,166,183,.3);border-radius:18px;
    color:#f1f5f8;font-size:12px;font-weight:650;letter-spacing:.01em;text-decoration:none;
    box-shadow:0 3px 12px rgba(0,0,0,.24);backdrop-filter:blur(8px)}
  .mobile-back:hover{background:rgba(35,42,51,.94)}
  input[type=date]{min-height:44px;font-size:16px}
  input[type=range]{height:34px}
  #panelContent .time-section{display:none}
  .date-row button{min-height:44px;padding:8px;font-size:13px;touch-action:manipulation}
  .readout{justify-content:space-between;padding:0 8px}
  #compass{top:calc(62px + env(safe-area-inset-top));right:14px}
  #mobileTimeline{display:block;margin:0 -16px;padding:14px 16px 8px;background:rgba(24,28,34,.98);
    border-bottom:1px solid #394452;color:#e8edf2;cursor:ns-resize;touch-action:none;user-select:none}
  #mobileTimeline::before{content:"";display:block;width:42px;height:4px;margin:-8px auto 6px;
    border-radius:4px;background:#687586}
  #mobileTimeline .timeline-head{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;color:#9da9b7}
  #mobileTimeline strong{color:#ffb53d;font-size:18px;font-variant-numeric:tabular-nums}
  #mobileTimeline input{display:block;width:100%;height:36px;margin:1px 0 0;accent-color:#ffb53d}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="compass" title="北方向"><div id="compassNeedle"></div><span>北</span></div>
<a class="mobile-back" href="index.html?restore=1" aria-label="地図に戻る">地図に戻る</a>
<div id="panel">
  <div id="mobileTimeline" aria-label="時刻設定。上にスワイプして日付と判定結果を表示">
    <div class="timeline-head"><span>時刻</span><strong id="mobileTimeLabel">12:00</strong><span id="timelineHint">上にスワイプ</span></div>
    <input type="range" id="mobileTime" min="0" max="24" step="0.25" value="12" aria-label="時刻" />
  </div>
  <button id="panelToggle" class="panel-toggle" type="button" aria-expanded="true" aria-controls="panelContent">
    <span>日照設定・判定結果</span><span class="toggle-icon" aria-hidden="true">▼</span>
  </button>
  <div id="panelContent">
  <a class="back" href="index.html?restore=1">← 地図に戻る</a>
  <h1>詳細3Dモード</h1>
  <p class="sub">選択した建物周辺の光と遮蔽を確認</p>

  <label>日付</label>
  <div id="dateBtns">
    <div class="date-row">
      <button data-mo="3" data-d="20">春分</button>
      <button data-mo="6" data-d="21">夏至</button>
      <button data-mo="9" data-d="23">秋分</button>
      <button data-mo="12" data-d="22">冬至</button>
    </div>
    <div class="date-row">
      <button data-preset="today">今日</button>
      <button data-preset="custom">カスタム</button>
    </div>
  </div>
  <input type="date" id="date" style="display:none" />
  <div id="dateErr" class="dateerr"></div>

  <div class="time-section"><label for="time">時刻 <span class="val" id="timeLabel">12:00</span></label>
  <input type="range" id="time" min="0" max="24" step="0.25" value="12" />

  <div class="readout">
    <div><span>太陽高度角</span><b id="alt">–</b></div>
    <div><span>太陽方位角</span><b id="az">–</b></div>
  </div>
  </div>
  <div id="status">読み込み中…</div>
  <div id="bid"></div>
  <div id="errMsg"></div>
  <div class="notes">
    ※ この詳細3D表示は階数別の日照を厳密に判定するものではなく、周辺建物との位置関係から大まかに確認するためのものです。
  </div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   detail.html — Three.js 詳細3Dモード
   同じ GeoJSON を読み、対象建物と近隣の建物を3Dで表示し、
   太陽方向の光照/遮蔽を可視化。
   ========================================================= */
const DEFAULT_LOCATION = { lat: 35.6590, lng: 139.8770 };
const NEIGHBOR_RADIUS = 200; // m
const DEG_LAT = 110540;
let sunOrigin = DEFAULT_LOCATION;

const el = id => document.getElementById(id);
const dateInput = el("date"), dateBtns = el("dateBtns"), dateErr = el("dateErr");
const timeInput = el("time"), timeLabel = el("timeLabel");
const altOut = el("alt"), azOut = el("az");
const statusEl = el("status"), errMsg = el("errMsg"), bidEl = el("bid");
const compassNeedle = el("compassNeedle");
const panel = el("panel"), panelToggle = el("panelToggle");
const mobileTime = el("mobileTime"), mobileTimeLabel = el("mobileTimeLabel");
const mobileTimeline = el("mobileTimeline"), timelineHint = el("timelineHint");

function setPanelCollapsed(collapsed){
  panel.classList.toggle("panel-collapsed",collapsed);
  panelToggle.setAttribute("aria-expanded",String(!collapsed));
  timelineHint.textContent=collapsed ? "上にスワイプ" : "下にスワイプして閉じる";
}

panelToggle.addEventListener("click",()=>{
  setPanelCollapsed(!panel.classList.contains("panel-collapsed"));
});
if(matchMedia("(max-width: 600px)").matches){
  setPanelCollapsed(true);
}

let sheetStart=null;
mobileTimeline.addEventListener("pointerdown",event=>{
  sheetStart={x:event.clientX,y:event.clientY};
});
mobileTimeline.addEventListener("pointerup",event=>{
  if(!sheetStart) return;
  const dx=event.clientX-sheetStart.x,dy=event.clientY-sheetStart.y;
  sheetStart=null;
  if(Math.abs(dy)<24 || Math.abs(dy)<=Math.abs(dx)) return;
  setPanelCollapsed(dy>0);
});

// URL パラメータ
const params = new URLSearchParams(location.search);
const buildingId = params.get("buildingId") || "";
const geojsonUrl = params.get("geojson") || "./data/higashikasai_buildings.geojson";
const initTime = parseFloat(params.get("time") || "12");
timeInput.value = initTime;
mobileTime.value = initTime;
bidEl.textContent = "建物を読み込み中…";

const pad2 = n => String(n).padStart(2, "0");
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function isValidDate(str){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(str||""); if(!m) return false;
  const y=+m[1], mo=+m[2], d=+m[3];
  const dt=new Date(y, mo-1, d);
  return dt.getFullYear()===y && dt.getMonth()===mo-1 && dt.getDate()===d;
}
function fmtTime(v){ const h=Math.floor(v),m=Math.round((v-h)*60);
  return String(h).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
timeLabel.textContent = fmtTime(initTime);
mobileTimeLabel.textContent = fmtTime(initTime);

// 座標変換: lng/lat → ローカル(m)
function toLocal(lng, lat, ref) {
  const DEG_LNG = 111320 * Math.cos(ref[1] * Math.PI / 180);
  return [(lng - ref[0]) * DEG_LNG, (lat - ref[1]) * DEG_LAT];
}
function dist2d(a, b) {
  const DEG_LNG = 111320 * Math.cos(b[1] * Math.PI / 180);
  const dx = (a[0]-b[0])*DEG_LNG, dy = (a[1]-b[1])*DEG_LAT;
  return Math.sqrt(dx*dx+dy*dy);
}
function centroid(ring) {
  let sx=0,sy=0; const n=ring.length-1;
  for(let i=0;i<n;i++){sx+=ring[i][0];sy+=ring[i][1];}
  return [sx/n, sy/n];
}

// 方向名(8方位)
const DIR_NAMES=["北","北東","東","南東","南","南西","西","北西"];
function dirName(azDeg){ return DIR_NAMES[Math.round(((azDeg%360+360)%360)/45)%8]; }

// === Three.js セットアップ ===
const canvas = el("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0xd4e6f1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 1, 2000);
// 進入前の地図視角(zoom/pitch/bearing)を sessionStorage から読み、初期カメラに反映
let _entry={bearing:0,pitch:45,zoom:18};
try{ const st=JSON.parse(sessionStorage.getItem("sunmap")||"{}");
  if(st&&typeof st.bearing==="number"){
    _entry.bearing=st.bearing;
    _entry.pitch = (st.pitch!=null)?st.pitch:45;
    _entry.zoom  = (st.zoom!=null)?st.zoom:18;
    if(Array.isArray(st.center)) sunOrigin = { lng: st.center[0], lat: st.center[1] };
  } }catch(e){}
(function initCam(){
  // zoom が大きいほどカメラを近づける（zoom17→240m, 18→150m, 19→95m 目安）
  const D = Math.max(70, Math.min(600, 240 * Math.pow(2, 17 - _entry.zoom)));
  // map pitch: 0=真上見下ろし → 高い仰角 / 60=斜め → 低い仰角
  const elev = Math.max(12, 90 - _entry.pitch) * Math.PI/180;
  const br = _entry.bearing * Math.PI/180;
  const horiz = D * Math.cos(elev);
  camera.position.set(horiz*Math.sin(br), D*Math.sin(elev), horiz*Math.cos(br));
})();
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 20, 0);
controls.enableDamping = true;
// 主地図(MapLibre)と操作感を合わせる: 左ドラッグ=平行移動 / 右ドラッグ=回転 / ホイール=ズーム
controls.mouseButtons = {
  LEFT: THREE.MOUSE.PAN,
  MIDDLE: THREE.MOUSE.DOLLY,
  RIGHT: THREE.MOUSE.ROTATE
};
// MapLibre と同じタッチ操作: 1本指で移動、2本指でズーム・角度変更
controls.touches = {
  ONE: THREE.TOUCH.PAN,
  TWO: THREE.TOUCH.DOLLY_ROTATE
};

const initDate = params.get("date") || todayStr();
dateInput.value = isValidDate(initDate) ? initDate : todayStr();

function markDateActive(btn){
  dateBtns.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");
}
function applyDate(str, btn){
  if(!isValidDate(str)){ dateErr.textContent="存在しない日付です"; return; }
  dateErr.textContent="";
  dateInput.value=str;
  markDateActive(btn);
  updateSun();
}
dateBtns.addEventListener("click",(e)=>{
  const b=e.target.closest("button"); if(!b) return;
  const preset=b.dataset.preset;
  if(preset==="custom"){
    dateInput.style.display="block";
    markDateActive(b);
    dateInput.focus();
    return;
  }
  dateInput.style.display="none";
  if(preset==="today"){ applyDate(todayStr(), b); return; }
  const y=(dateInput.value.split("-")[0]) || String(new Date().getFullYear());
  applyDate(`${y}-${pad2(+b.dataset.mo)}-${pad2(+b.dataset.d)}`, b);
});
dateInput.addEventListener("change",()=>applyDate(dateInput.value, dateBtns.querySelector('[data-preset="custom"]')));

// 地面
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600, 600),
  new THREE.MeshStandardMaterial({ color: 0xe8e0d8 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// 照明
const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);
const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
sunLight.castShadow = true;
sunLight.shadow.camera.left = -300;
sunLight.shadow.camera.right = 300;
sunLight.shadow.camera.top = 300;
sunLight.shadow.camera.bottom = -300;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 800;
sunLight.shadow.mapSize.set(2048, 2048);
scene.add(sunLight);
scene.add(sunLight.target);

// 建物メッシュ作成
const MAT_TARGET = new THREE.MeshStandardMaterial({ color: 0xff9933, side: THREE.DoubleSide });
const MAT_NEIGHBOR = new THREE.MeshStandardMaterial({ color: 0x999999, transparent: true, opacity: 0.7, side: THREE.DoubleSide });

function buildMesh(feature, ref, material) {
  const ring = feature.geometry.coordinates[0];
  const h = Number(feature.properties.height) || 3;
  const pts = ring.map(c => toLocal(c[0], c[1], ref));
  const shape = new THREE.Shape();
  shape.moveTo(pts[0][0], pts[0][1]);
  for (let i=1; i<pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
  const geom = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false });
  const mesh = new THREE.Mesh(geom, material);
  mesh.rotation.x = -Math.PI/2;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// === データ読み込み & シーン構築 ===
let targetFeature = null;
let neighbors = [];   // { feature, cx, cy } in local meters

async function init() {
  let fc;
  try {
    const r = await fetch(geojsonUrl);
    if (!r.ok) throw new Error("HTTP " + r.status);
    fc = await r.json();
  } catch(e) {
    errMsg.textContent = "GeoJSON 読み込み失敗: " + e;
    statusEl.textContent = "データエラー";
    return;
  }

  // 対象建物を探す
  // 安定IDを優先(gml_id)。暫定で index- プレフィックスにも対応。
  // ※ 将来は安定IDに統一すること
  if (buildingId.startsWith("index-")) {
    const idx = parseInt(buildingId.replace("index-",""), 10);
    targetFeature = fc.features[idx] || null;
  } else {
    targetFeature = fc.features.find(f => f.properties.gml_id === buildingId) || null;
  }
  if (!targetFeature) {
    errMsg.textContent = "建物が見つかりません: " + buildingId;
    statusEl.textContent = "対象建物なし";
    return;
  }

  const tgtRing = targetFeature.geometry.coordinates[0];
  const tgtC = centroid(tgtRing); // [lng, lat]
  const ref = tgtC; // ローカル座標の原点

  // 対象建物のメッシュ
  scene.add(buildMesh(targetFeature, ref, MAT_TARGET));

  // 周辺建物（対象建物の近傍のみ）
  for (const f of fc.features) {
    if (f === targetFeature) continue;
    const c = centroid(f.geometry.coordinates[0]);
    const d = dist2d(c, tgtC);
    if (d > NEIGHBOR_RADIUS) continue;
    const [lx, ly] = toLocal(c[0], c[1], ref);
    neighbors.push({ feature: f, cx: lx, cy: ly, height: Number(f.properties.height)||3 });
    scene.add(buildMesh(f, ref, MAT_NEIGHBOR));
  }

  const tgtH = Number(targetFeature.properties.height)||3;
  bidEl.textContent = `高さ: ${tgtH.toFixed(1)}m　周辺: ${neighbors.length}棟`;
  updateSun();
}

// === 太陽位置 & 遮蔽判定 ===
function getSun() {
  const [y,mo,d] = dateInput.value.split("-").map(Number);
  const v = parseFloat(timeInput.value);
  const hh = Math.floor(v), mi = Math.round((v-hh)*60);
  const dt = new Date(Date.UTC(y, mo-1, d, hh-9, mi));
  const p = SunCalc.getPosition(dt, sunOrigin.lat, sunOrigin.lng);
  const altDeg = p.altitude * 180 / Math.PI;
  const sunBearing = (p.azimuth * 180 / Math.PI + 180 + 360) % 360;
  return { altDeg, sunBearing };
}

function updateSun() {
  const sun = getSun();
  altOut.textContent = sun.altDeg.toFixed(1) + "°";
  azOut.textContent = sun.sunBearing.toFixed(0) + "°";

  // DirectionalLight の位置を太陽方向にセット
  const R = 400;
  const azRad = sun.sunBearing * Math.PI / 180;
  const altRad = Math.max(0, sun.altDeg) * Math.PI / 180;
  sunLight.position.set(
    R * Math.sin(azRad) * Math.cos(altRad),
    R * Math.sin(altRad),
    -R * Math.cos(azRad) * Math.cos(altRad)
  );
  sunLight.intensity = sun.altDeg > 0 ? 1.0 : 0.05;
  ambient.intensity = sun.altDeg > 0 ? 0.4 : 0.15;

  if (sun.altDeg <= 0) {
    statusEl.innerHTML = "太陽は地平線下です。日照判定はできません。";
    return;
  }
  if (!targetFeature) return;

  // 遮蔽判定: 周辺建物が太陽方向にあり、影が対象に届くか
  const shadowAz = (sun.sunBearing + 180) % 360;
  const shadowAzRad = shadowAz * Math.PI / 180;
  const sdx = Math.sin(shadowAzRad), sdy = Math.cos(shadowAzRad);
  const tanAlt = Math.tan(altRad);

  let occluders = [];
  for (const nb of neighbors) {
    const dx = -nb.cx, dy = -nb.cy; // neighbor→target
    const along = dx*sdx + dy*sdy;
    const perp = Math.abs(dx*sdy - dy*sdx);
    const shadowLen = nb.height / tanAlt;
    if (along > 0 && along < shadowLen && perp < 40) {
      const azToNb = (Math.atan2(nb.cx, nb.cy) * 180 / Math.PI + 360) % 360;
      occluders.push({ dir: dirName(azToNb), h: nb.height, dist: Math.sqrt(nb.cx*nb.cx+nb.cy*nb.cy) });
    }
  }

  if (occluders.length > 0) {
    const top = occluders.sort((a,b)=>b.h-a.h)[0];
    statusEl.innerHTML = `<b class="occ">遮蔽物あり</b>　${top.dir}方向に高さ${top.h.toFixed(0)}mの建物（約${top.dist.toFixed(0)}m先）<br>`
      + `計${occluders.length}棟が太陽方向に位置しています`;
  } else {
    statusEl.innerHTML = `<b class="dir">直射の可能性あり</b>　現在の太陽方向（${dirName(sun.sunBearing)}・高度${sun.altDeg.toFixed(0)}°）に`
      + `遮蔽となる建物は見当たりません`;
  }
}

timeInput.addEventListener("input", () => {
  timeLabel.textContent = fmtTime(parseFloat(timeInput.value));
  mobileTime.value = timeInput.value;
  mobileTimeLabel.textContent = timeLabel.textContent;
  updateSun();
});
mobileTime.addEventListener("input", () => {
  timeInput.value = mobileTime.value;
  timeLabel.textContent = mobileTimeLabel.textContent = fmtTime(parseFloat(mobileTime.value));
  updateSun();
});

// リサイズ対応
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// アニメーションループ
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  const dx = camera.position.x - controls.target.x;
  const dz = camera.position.z - controls.target.z;
  const angle = Math.atan2(dx, dz) * 180 / Math.PI;
  compassNeedle.style.transform = `rotate(${angle}deg)`;
  renderer.render(scene, camera);
}
animate();
init();
</script>
