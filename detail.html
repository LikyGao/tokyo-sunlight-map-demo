<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;font-family:system-ui,"Yu Gothic",Meiryo,sans-serif}
#c{position:absolute;inset:0}
#panel{position:absolute;top:10px;left:10px;z-index:5;width:300px;max-width:calc(100% - 20px);
  background:rgba(24,28,34,.94);color:#e8edf2;border:1px solid #2b3340;border-radius:10px;

    padding:0 16px calc(14px + env(safe-area-inset-bottom));border-width:1px 0 0;

  .mobile-back:hover{background:rgba(35,42,51,.94)}

@media (max-width:600px){

  #panel{max-height:min(70dvh,620px);padding:0 16px calc(14px + env(safe-area-inset-bottom));

    box-shadow:0 -10px 28px rgba(10,17,23,.24)}
  #panel.panel-collapsed{max-height:calc(128px + env(safe-area-inset-bottom))}
  .mobile-back{top:calc(16px + env(safe-area-inset-top));left:16px;right:auto;width:44px;height:44px;min-height:44px;

    border-bottom:10px solid #df4b3f}

  #mobileTimeline{height:128px;margin:0 -16px;padding:17px 16px 12px;border:0;
    background:var(--mobile-sheet);cursor:ns-resize}
  #mobileTimeline::before{width:42px;height:4px;margin:-10px auto 10px;background:#74808d}
  #mobileTimeline .timeline-head{height:38px;align-items:center;color:#9ca7b1}
  #mobileTimeline strong{color:var(--mobile-accent);font-size:22px;line-height:1}
  #mobileTimeline .timeline-date{font-size:11px;font-weight:600}

    background:linear-gradient(to right,var(--mobile-accent) 0,var(--mobile-accent) var(--range-pct,50%),#515a64 var(--range-pct,50%),#515a64 100%)}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   detail.html — Three.js 詳細3Dモード
   同じ GeoJSON を読み、対象建物と近隣の建物を3Dで表示し、
   太陽方向の光照/遮蔽を可視化。
   ========================================================= */
const DEFAULT_LOCATION = { lat: 35.6590, lng: 139.8770 };
const NEIGHBOR_RADIUS = 200; // m
const DEG_LAT = 110540;
let sunOrigin = DEFAULT_LOCATION;

const el = id => document.getElementById(id);
const dateInput = el("date"), dateBtns = el("dateBtns"), dateErr = el("dateErr");
const timeInput = el("time"), timeLabel = el("timeLabel");
const altOut = el("alt"), azOut = el("az");
const statusEl = el("status"), errMsg = el("errMsg"), bidEl = el("bid");
const compassNeedle = el("compassNeedle");
const panel = el("panel"), panelToggle = el("panelToggle");
const mobileTime = el("mobileTime"), mobileTimeLabel = el("mobileTimeLabel");
const mobileTimeline = el("mobileTimeline"), mobileSheetToggle = el("mobileSheetToggle");
function syncMobileRangeFill(){
  const min=Number(mobileTime.min)||0, max=Number(mobileTime.max)||24, value=Number(mobileTime.value)||0;
  mobileTime.style.setProperty("--range-pct",`${((value-min)/(max-min))*100}%`);
}

function setPanelCollapsed(collapsed){
  panel.classList.toggle("panel-collapsed",collapsed);
  panelToggle.setAttribute("aria-expanded",String(!collapsed));
}

panelToggle.addEventListener("click",()=>{
  setPanelCollapsed(!panel.classList.contains("panel-collapsed"));
});
mobileSheetToggle.addEventListener("click",()=>{
  setPanelCollapsed(!panel.classList.contains("panel-collapsed"));
});
if(matchMedia("(max-width: 600px)").matches){
  setPanelCollapsed(true);
}

let sheetStart=null;
mobileTimeline.addEventListener("pointerdown",event=>{
  sheetStart={x:event.clientX,y:event.clientY};
});
mobileTimeline.addEventListener("pointerup",event=>{
  if(!sheetStart) return;
  const dx=event.clientX-sheetStart.x,dy=event.clientY-sheetStart.y;
  sheetStart=null;
  if(Math.abs(dy)<24 || Math.abs(dy)<=Math.abs(dx)) return;
  setPanelCollapsed(dy>0);
});

// URL パラメータ
const params = new URLSearchParams(location.search);
const buildingId = params.get("buildingId") || "";
const geojsonUrl = params.get("geojson") || "./data/higashikasai_buildings.geojson";
const lod2UrlParam = params.get("lod2") || "";
const BUILTIN_LOD2_URLS = {
  "bldg_7aff4a51-be8b-405b-abe4-ac489697cbc8": "./data/landmarks/lod2/tokyo_tower_lod2_surfaces.json",
  "bldg_58ab8c46-8369-49c4-86cf-6912bbc4efe1": "./data/landmarks/lod2/tokyo_skytree_lod2_surfaces.json",
  "bldg_6006c155-ea28-4848-81b0-c37444f2bd96": "./data/landmarks/lod2/roppongi_hills_mori_tower_lod2_surfaces.json"
};
const initTime = parseFloat(params.get("time") || "12");
timeInput.value = initTime;
mobileTime.value = initTime;
syncMobileRangeFill();
bidEl.textContent = "建物を読み込み中…";

const pad2 = n => String(n).padStart(2, "0");
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function isValidDate(str){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(str||""); if(!m) return false;
  const y=+m[1], mo=+m[2], d=+m[3];
  const dt=new Date(y, mo-1, d);
  return dt.getFullYear()===y && dt.getMonth()===mo-1 && dt.getDate()===d;
}
function fmtTime(v){ const h=Math.floor(v),m=Math.round((v-h)*60);
  return String(h).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
timeLabel.textContent = fmtTime(initTime);
mobileTimeLabel.textContent = fmtTime(initTime);

// 座標変換: lng/lat → ローカル(m)
function toLocal(lng, lat, ref) {
  const DEG_LNG = 111320 * Math.cos(ref[1] * Math.PI / 180);
  return [(lng - ref[0]) * DEG_LNG, (lat - ref[1]) * DEG_LAT];
}
function dist2d(a, b) {
  const DEG_LNG = 111320 * Math.cos(b[1] * Math.PI / 180);
  const dx = (a[0]-b[0])*DEG_LNG, dy = (a[1]-b[1])*DEG_LAT;
  return Math.sqrt(dx*dx+dy*dy);
}
function centroid(ring) {
  let sx=0,sy=0; const n=ring.length-1;
  for(let i=0;i<n;i++){sx+=ring[i][0];sy+=ring[i][1];}
  return [sx/n, sy/n];
}
function normalizeLod2SurfaceRings(surface){
  if(!Array.isArray(surface) || !surface.length) return [];
  const first = surface[0];
  if(Array.isArray(first) && typeof first[0] === "number") return [surface];
  return surface.filter(ring => Array.isArray(ring) && ring.length);
}
function lod2Footprint(data){
  const pts = [];
  for(const surface of data.surfaces || []){
    for(const ring of normalizeLod2SurfaceRings(surface)){
      for(const p of ring){
        if(Array.isArray(p) && Number.isFinite(p[0]) && Number.isFinite(p[1])) pts.push([p[0], p[1]]);
      }
    }
  }
  pts.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  if(pts.length<3) return null;
  const cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];
  for(const p of pts){while(lo.length>=2&&cross(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  for(let i=pts.length-1;i>=0;i--){const p=pts[i];while(up.length>=2&&cross(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
  lo.pop();up.pop();const h=lo.concat(up);h.push(h[0]);return h;
}
function lod2GeometryHeight(data){
  return Math.max(
    Number(data && data.height) || 0,
    Math.max(0, (data && data.bbox && data.bbox[5] - data.bbox[2]) || 0)
  );
}
const LOD2_DATA_CACHE = new Map();
async function lod2UrlForBuilding(gmlId, allowUrlParam=true){
  if(allowUrlParam && lod2UrlParam) return lod2UrlParam;
  if(BUILTIN_LOD2_URLS[gmlId]) return BUILTIN_LOD2_URLS[gmlId];
  try{
    const manifest = await fetch("./data/landmarks/lod2/manifest.json", {cache:"no-cache"}).then(r=>r.ok?r.json():null);
    const model = manifest && Array.isArray(manifest.models) ? manifest.models.find(m=>m.gml_id===gmlId) : null;
    return model ? model.url : "";
  }catch(e){ return ""; }
}
async function loadLod2Data(gmlId, allowUrlParam=true){
  const url = await lod2UrlForBuilding(gmlId, allowUrlParam);
  if(!url) return null;
  if(LOD2_DATA_CACHE.has(url)) return LOD2_DATA_CACHE.get(url);
  try{
    const r = await fetch(url, {cache:"no-cache"});
    const data = r.ok ? await r.json() : null;
    if(data) LOD2_DATA_CACHE.set(url, data);
    return data;
  }catch(e){ return null; }
}

// 方向名(8方位)
const DIR_NAMES=["北","北東","東","南東","南","南西","西","北西"];
function dirName(azDeg){ return DIR_NAMES[Math.round(((azDeg%360+360)%360)/45)%8]; }

// === Three.js セットアップ ===
const canvas = el("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0xd4e6f1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 1, 3000);
// 進入前の地図視角(zoom/pitch/bearing)を sessionStorage から読み、初期カメラに反映
let _entry={bearing:0,pitch:45,zoom:18};
let _entryDistance=240, _entryElev=Math.PI/4, _entryBearing=0;
try{ const st=JSON.parse(sessionStorage.getItem("sunmap")||"{}");
  if(st&&typeof st.bearing==="number"){
    _entry.bearing=st.bearing;
    _entry.pitch = (st.pitch!=null)?st.pitch:45;
    _entry.zoom  = (st.zoom!=null)?st.zoom:18;
    if(Array.isArray(st.center)) sunOrigin = { lng: st.center[0], lat: st.center[1] };
  } }catch(e){}
(function initCam(){
  // zoom が大きいほどカメラを近づける（zoom17→240m, 18→150m, 19→95m 目安）
  const D = Math.max(70, Math.min(600, 240 * Math.pow(2, 17 - _entry.zoom)));
  // map pitch: 0=真上見下ろし → 高い仰角 / 60=斜め → 低い仰角
  const elev = Math.max(12, 90 - _entry.pitch) * Math.PI/180;
  const br = _entry.bearing * Math.PI/180;
  _entryDistance=D; _entryElev=elev; _entryBearing=br;
  const horiz = D * Math.cos(elev);
  camera.position.set(horiz*Math.sin(br), D*Math.sin(elev), horiz*Math.cos(br));
})();
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 20, 0);
controls.enableDamping = true;
// 主地図(MapLibre)と操作感を合わせる: 左ドラッグ=平行移動 / 右ドラッグ=回転 / ホイール=ズーム
controls.mouseButtons = {
  LEFT: THREE.MOUSE.PAN,
  MIDDLE: THREE.MOUSE.DOLLY,
  RIGHT: THREE.MOUSE.ROTATE
};
// MapLibre と同じタッチ操作: 1本指で移動、2本指でズーム・角度変更
controls.touches = {
  ONE: THREE.TOUCH.PAN,
  TWO: THREE.TOUCH.DOLLY_ROTATE
};

const initDate = params.get("date") || todayStr();
dateInput.value = isValidDate(initDate) ? initDate : todayStr();

function markDateActive(btn){
  dateBtns.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");
}
function applyDate(str, btn){
  if(!isValidDate(str)){ dateErr.textContent="存在しない日付です"; return; }
  dateErr.textContent="";
  dateInput.value=str;
  markDateActive(btn);
  updateSun();
}

dateInput.addEventListener("change",()=>applyDate(dateInput.value, dateBtns.querySelector('[data-preset="custom"]')));

// 地面
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600, 600),
  new THREE.MeshStandardMaterial({ color: 0xe8e0d8 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// 照明
const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);
const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
sunLight.castShadow = true;
sunLight.shadow.camera.left = -300;
sunLight.shadow.camera.right = 300;
sunLight.shadow.camera.top = 300;
sunLight.shadow.camera.bottom = -300;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 800;
sunLight.shadow.mapSize.set(2048, 2048);
scene.add(sunLight);
scene.add(sunLight.target);

// 建物メッシュ作成
const MAT_TARGET = new THREE.MeshStandardMaterial({ color: 0xff9933, side: THREE.DoubleSide });
const MAT_NEIGHBOR = new THREE.MeshStandardMaterial({ color: 0x999999, transparent: true, opacity: 0.7, side: THREE.DoubleSide });

function buildMesh(feature, ref, material) {
  const ring = feature.geometry.coordinates[0];
  const h = Number(feature.properties.height) || 3;
  const pts = ring.map(c => toLocal(c[0], c[1], ref));
  const shape = new THREE.Shape();
  shape.moveTo(pts[0][0], pts[0][1]);
  for (let i=1; i<pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
  const geom = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false });
  const mesh = new THREE.Mesh(geom, material);
  mesh.rotation.x = -Math.PI/2;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function buildLod2Mesh(data, ref, material, lineColor=0x755e48) {
  const vertices = [];
  const indices = [];
  const lineVertices = [];
  const groundElevation = Number(data.ground_elevation ?? (data.bbox && data.bbox[2])) || 0;
  const localHeight = p => Math.max(0, (Number(p[2]) || groundElevation) - groundElevation);
  for(const surface of data.surfaces || []){
    for(const ring of normalizeLod2SurfaceRings(surface)){
      const clean = ring.filter(p => Array.isArray(p) && p.length >= 3).slice();
      if(clean.length > 1){
        const a = clean[0], b = clean[clean.length - 1];
        if(Math.abs(a[0]-b[0]) < 1e-10 && Math.abs(a[1]-b[1]) < 1e-10 && Math.abs((a[2]||0)-(b[2]||0)) < 1e-6) clean.pop();
      }
      if(clean.length < 3) continue;
      const base = vertices.length / 3;
      for(const p of clean){
        const [x, y] = toLocal(p[0], p[1], ref);
        vertices.push(x, localHeight(p), -y);
      }
      for(let i=1; i<clean.length-1; i++) indices.push(base, base+i, base+i+1);
      for(let i=0; i<clean.length; i++){
        const a = clean[i], b = clean[(i+1)%clean.length];
        const [ax, ay] = toLocal(a[0], a[1], ref);
        const [bx, by] = toLocal(b[0], b[1], ref);
        lineVertices.push(ax, localHeight(a), -ay, bx, localHeight(b), -by);
      }
    }
  }
  const group = new THREE.Group();
  const geom = new THREE.BufferGeometry();
  geom.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  const mesh = new THREE.Mesh(geom, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  group.add(mesh);

  const lineGeom = new THREE.BufferGeometry();
  lineGeom.setAttribute("position", new THREE.Float32BufferAttribute(lineVertices, 3));
  const lines = new THREE.LineSegments(lineGeom, new THREE.LineBasicMaterial({
    color: lineColor,
    transparent: true,
    opacity: 0.28
  }));
  group.add(lines);
  return group;
}
function frameLod2Target(height, targetX=0, targetZ=0){
  const h = Math.max(3, Number(height) || 3);
  const distance = Math.max(_entryDistance, h * 1.48);
  const targetY = h * 0.44;
  const horiz = distance * Math.cos(_entryElev);
  controls.target.set(targetX, targetY, targetZ);
  camera.position.set(
    targetX + horiz * Math.sin(_entryBearing),
    targetY + distance * Math.sin(_entryElev),
    targetZ + horiz * Math.cos(_entryBearing)
  );
  camera.near = Math.max(0.5, distance / 1000);
  camera.far = Math.max(3000, distance * 4);
  camera.updateProjectionMatrix();
  controls.update();
}

// === データ読み込み & シーン構築 ===
let targetFeature = null;
let neighbors = [];   // { feature, cx, cy } in local meters

async function init() {
  let fc;
  try {
    const r = await fetch(geojsonUrl);
    if (!r.ok) throw new Error("HTTP " + r.status);
    fc = await r.json();
  } catch(e) {
    errMsg.textContent = "GeoJSON 読み込み失敗: " + e;
    statusEl.textContent = "データエラー";
    return;
  }

  const lod2Data = await loadLod2Data(buildingId);
  const targetBuildingId = (lod2Data && lod2Data.gml_id) || buildingId;

  // 対象建物を探す
  // 安定IDを優先(gml_id)。暫定で index- プレフィックスにも対応。
  // ※ 将来は安定IDに統一すること
  if (targetBuildingId.startsWith("index-")) {
    const idx = parseInt(targetBuildingId.replace("index-",""), 10);
    targetFeature = fc.features[idx] || null;
  } else {
    targetFeature = fc.features.find(f => f.properties.gml_id === targetBuildingId) || null;
  }
  if (!targetFeature) {
    errMsg.textContent = "建物が見つかりません: " + buildingId;
    statusEl.textContent = "対象建物なし";
    return;
  }

  const lod2Ring = lod2Data ? lod2Footprint(lod2Data) : null;
  const tgtRing = lod2Ring || targetFeature.geometry.coordinates[0];
  const tgtC = centroid(tgtRing); // [lng, lat]
  const ref = tgtC; // ローカル座標の原点

  // 対象建物のメッシュ
  if(lod2Data){
    scene.add(buildLod2Mesh(lod2Data, ref, MAT_TARGET));
    frameLod2Target(lod2GeometryHeight(lod2Data) || targetFeature.properties.height);
  } else {
    scene.add(buildMesh(targetFeature, ref, MAT_TARGET));
  }

  // 周辺建物（対象建物の近傍のみ）
  let tallestNeighborLod2 = null;
  for (const f of fc.features) {
    if (f === targetFeature || (targetBuildingId && f.properties.gml_id === targetBuildingId)) continue;
    const c = centroid(f.geometry.coordinates[0]);
    const d = dist2d(c, tgtC);
    if (d > NEIGHBOR_RADIUS) continue;
    const [lx, ly] = toLocal(c[0], c[1], ref);
    const neighborGmlId = f.properties && f.properties.gml_id;
    const neighborLod2 = BUILTIN_LOD2_URLS[neighborGmlId]
      ? await loadLod2Data(neighborGmlId, false)
      : null;
    const neighborHeight = neighborLod2
      ? lod2GeometryHeight(neighborLod2)
      : Number(f.properties.height) || 3;
    if(neighborLod2 && (!tallestNeighborLod2 || neighborHeight > tallestNeighborLod2.height)){
      tallestNeighborLod2 = { height:neighborHeight, x:lx, z:-ly };
    }
    neighbors.push({ feature: f, cx: lx, cy: ly, height: neighborHeight });
    scene.add(neighborLod2
      ? buildLod2Mesh(neighborLod2, ref, MAT_NEIGHBOR, 0x666666)
      : buildMesh(f, ref, MAT_NEIGHBOR));
  }
  if(!lod2Data && tallestNeighborLod2){
    frameLod2Target(
      tallestNeighborLod2.height,
      tallestNeighborLod2.x * 0.5,
      tallestNeighborLod2.z * 0.5
    );
  }

  const tgtH = Number((lod2Data && lod2GeometryHeight(lod2Data)) || targetFeature.properties.height)||3;
  bidEl.textContent = `高さ: ${tgtH.toFixed(1)}m　周辺: ${neighbors.length}棟${lod2Data ? "　PLATEAU LOD2" : ""}`;
  updateSun();
}

// === 太陽位置 & 遮蔽判定 ===
function getSun() {
  const [y,mo,d] = dateInput.value.split("-").map(Number);
  const v = parseFloat(timeInput.value);
  const hh = Math.floor(v), mi = Math.round((v-hh)*60);
  const dt = new Date(Date.UTC(y, mo-1, d, hh-9, mi));
  const p = SunCalc.getPosition(dt, sunOrigin.lat, sunOrigin.lng);
  const altDeg = p.altitude * 180 / Math.PI;
  const sunBearing = (p.azimuth * 180 / Math.PI + 180 + 360) % 360;
  return { altDeg, sunBearing };
}

function updateSun() {
  const sun = getSun();
  altOut.textContent = sun.altDeg.toFixed(1) + "°";
  azOut.textContent = sun.sunBearing.toFixed(0) + "°";

  // DirectionalLight の位置を太陽方向にセット
  const R = 400;
  const azRad = sun.sunBearing * Math.PI / 180;
  const altRad = Math.max(0, sun.altDeg) * Math.PI / 180;
  sunLight.position.set(
    R * Math.sin(azRad) * Math.cos(altRad),
    R * Math.sin(altRad),
    -R * Math.cos(azRad) * Math.cos(altRad)
  );
  sunLight.intensity = sun.altDeg > 0 ? 1.0 : 0.05;
  ambient.intensity = sun.altDeg > 0 ? 0.4 : 0.15;

  if (sun.altDeg <= 0) {
    statusEl.innerHTML = "太陽は地平線下です。日照判定はできません。";
    return;
  }
  if (!targetFeature) return;

  // 遮蔽判定: 周辺建物が太陽方向にあり、影が対象に届くか
  const shadowAz = (sun.sunBearing + 180) % 360;
  const shadowAzRad = shadowAz * Math.PI / 180;
  const sdx = Math.sin(shadowAzRad), sdy = Math.cos(shadowAzRad);
  const tanAlt = Math.tan(altRad);

  let occluders = [];
  for (const nb of neighbors) {
    const dx = -nb.cx, dy = -nb.cy; // neighbor→target
    const along = dx*sdx + dy*sdy;
    const perp = Math.abs(dx*sdy - dy*sdx);
    const shadowLen = nb.height / tanAlt;
    if (along > 0 && along < shadowLen && perp < 40) {
      const azToNb = (Math.atan2(nb.cx, nb.cy) * 180 / Math.PI + 360) % 360;
      occluders.push({ dir: dirName(azToNb), h: nb.height, dist: Math.sqrt(nb.cx*nb.cx+nb.cy*nb.cy) });
    }
  }

  if (occluders.length > 0) {
    const top = occluders.sort((a,b)=>b.h-a.h)[0];
    statusEl.innerHTML = `<b class="occ">遮蔽物あり</b>　${top.dir}方向に高さ${top.h.toFixed(0)}mの建物（約${top.dist.toFixed(0)}m先）<br>`
      + `計${occluders.length}棟が太陽方向に位置しています`;
  } else {
    statusEl.innerHTML = `<b class="dir">直射の可能性あり</b>　現在の太陽方向（${dirName(sun.sunBearing)}・高度${sun.altDeg.toFixed(0)}°）に`
      + `遮蔽となる建物は見当たりません`;
  }
}

// リサイズ対応
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// アニメーションループ
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  const dx = camera.position.x - controls.target.x;
  const dz = camera.position.z - controls.target.z;
  const angle = Math.atan2(dx, dz) * 180 / Math.PI;
  compassNeedle.style.transform = `rotate(${angle}deg)`;
  renderer.render(scene, camera);
}
animate();
init();
