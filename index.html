<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>東京 日当たりマップ</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,"Yu Gothic",Meiryo,sans-serif;color:#e8edf2}
  #map{position:absolute;inset:0}
  #panel{position:absolute;top:10px;left:10px;z-index:5;width:300px;max-width:calc(100% - 20px);
    background:rgba(24,28,34,.94);border:1px solid #2b3340;border-radius:10px;padding:14px}
  h1{font-size:14px;margin:0 0 10px}
  label{display:block;font-size:12px;color:#8d99a8;margin:10px 0 4px}
  input[type=date]{width:100%;background:#0f141b;border:1px solid #2b3340;color:#e8edf2;border-radius:6px;padding:6px 8px}
  input[type=range]{width:100%}
  .val{color:#ffb53d;font-weight:600}
  .readout{display:flex;gap:14px;margin-top:8px;font-variant-numeric:tabular-nums}
  .readout span{font-size:11px;color:#8d99a8;display:block}
  .readout b{font-size:15px}
  /* エラー表示（空白で放置しない） */
  #errBox{display:none;margin-top:10px;padding:10px;border-radius:6px;
    background:#3a1414;border:1px solid #7a2a2a;color:#ffb4b4;font-size:12px;line-height:1.6}
  /* === 追加: パネルのスクロール対応 === */
  #panel{max-height:calc(100% - 20px);overflow:auto}
  /* === 追加: 明るさ変化のオーバーレイ === */
  #brightness{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:transparent;transition:background .35s ease}
  #shadowCanvas{position:absolute;inset:0;z-index:1;pointer-events:none}
  /* === 追加: ボタン群 === */
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .btns button,.date-row button{flex:1;min-width:58px;background:#222a33;color:#e8edf2;border:1px solid #2b3340;
    border-radius:6px;padding:6px 4px;font-size:12px;cursor:pointer}
  .btns button:hover,.date-row button:hover{background:#2c3640}
  .btns button.active,.date-row button.active{background:#ffb53d;color:#1a1205;border-color:#ffb53d;font-weight:700}
  /* === 追加: トグル === */
  .toggles{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
  .tg{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#cdd6e0;margin:0;cursor:pointer}
  .sunstatus{margin-top:6px;font-size:12px;color:#ffd24a;min-height:1em}
  /* === 追加: 高さ凡例 === */
  .legend{margin-top:8px;font-size:11px;color:#8d99a8;display:flex;align-items:center;flex-wrap:wrap}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin:0 4px 0 8px}
  /* === 追加: 注意書き === */
  .notes{margin-top:10px;font-size:10.5px;color:#7e8a98;line-height:1.6;border-top:1px solid #2b3340;padding-top:8px}
  /* === 追加: 日付エラー === */
  .dateerr{color:#ff8a8a;font-size:12px;margin-top:6px;min-height:1em}
  /* === 追加: エリア選択 === */
  select{width:100%;background:#0f141b;border:1px solid #2b3340;color:#e8edf2;
    border-radius:6px;padding:6px 8px;font-size:13px;margin-bottom:6px;-webkit-appearance:auto}
  #currentArea{font-size:12px;color:#ffb53d;margin:4px 0 6px;font-weight:600}
  #areaNotice{font-size:12px;color:#ffd24a;min-height:1.2em;margin:4px 0 6px;line-height:1.5}
  /* === 追加: 検索 === */
  .search-row{display:flex;gap:6px;margin-bottom:10px}
  .search-row input{flex:1;background:#0f141b;border:1px solid #2b3340;color:#e8edf2;
    border-radius:6px;padding:6px 8px;font-size:13px}
  .search-row input::placeholder{color:#5d6878}
  .search-row button{white-space:nowrap;background:#222a33;color:#e8edf2;border:1px solid #2b3340;
    border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer}
  #searchMsg{font-size:11px;color:#9aa6b4;margin:0 0 8px;min-height:1em}
  /* === 追加: 日付2行 === */
  .date-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
</style>
</head>
<body>
<div id="map"></div>
<canvas id="shadowCanvas"></canvas>
<div id="brightness"></div>
<div id="panel">
  <h1>東京 日当たりマップ</h1>

  <label>クイック移動</label>
  <select id="selKu"><option value="">区を選択</option></select>
  <select id="selArea"><option value="">地域を選択してください</option></select>
  <div id="currentArea">表示中の地域：未選択</div>
  <div id="areaNotice"></div>

  <label>住所検索（現在の地域内）</label>
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="例：1-1-1、100-0001" />
    <button id="searchBtn">検索</button>
  </div>
  <div id="searchMsg"></div>

  <label>日付</label>
  <div id="dateBtns">
    <div class="date-row">
      <button data-mo="3" data-d="20">春分</button>
      <button data-mo="6" data-d="21">夏至</button>
      <button data-mo="9" data-d="23">秋分</button>
      <button data-mo="12" data-d="22">冬至</button>
    </div>
    <div class="date-row">
      <button data-preset="today" class="active">今日</button>
      <button data-preset="custom">カスタム日付</button>
    </div>
  </div>
  <input type="date" id="date" style="display:none" />
  <div id="dateErr" class="dateerr"></div>

  <label for="time">時刻 <span class="val" id="timeLabel">12:00</span></label>
  <input type="range" id="time" min="0" max="24" step="0.25" value="12" />

  <div class="readout">
    <div><span>太陽高度角</span><b id="alt">–</b></div>
    <div><span>太陽方位角</span><b id="az">–</b></div>
  </div>

  <!-- 表示モード -->
  <div class="btns">
    <button id="b2d" class="active">2D表示</button>
    <button id="b3d">3D表示</button>
    <button id="bnorth">北向きに戻す</button>
  </div>

  <!-- トグル -->
  <div class="toggles">
    <label class="tg"><input type="checkbox" id="tgBright" checked> 明るさ変化</label>
  </div>

  <!-- 高さ凡例 -->
  <div class="legend">高さ:
    <i style="background:#3a9d8f"></i>低層(&lt;10m)
    <i style="background:#3f7fd6"></i>中層
    <i style="background:#e8833a"></i>高層(&gt;31m)
  </div>

  <div id="errBox"></div>

  <div class="notes">
    ※ この表示は階数別の日照を厳密に判定するものではなく、建物高さと影の方向から大まかに確認するためのものです。<br>
    ※ 太陽位置は方向を分かりやすく示すための可視化です。実際の距離・大きさを表すものではありません。
  </div>
</div>

<script>
const DEFAULT_DATASETS = [
  {
    dataset_id: "chuo_harumi",
    ward: "中央区",
    area: "晴海",
    label: "中央区 晴海",
    bbox: [139.778, 35.645, 139.795, 35.663],
    center: [139.7870, 35.6550],
    geojson_path: "./data/harumi_buildings.geojson",
    fallback_geojson_path: "./data/harumi_buildings.geojson",
    address_prefix: "東京都中央区晴海"
  },
  {
    dataset_id: "edogawa_higashikasai",
    ward: "江戸川区",
    area: "東葛西",
    label: "江戸川区 東葛西",
    bbox: [139.866, 35.650, 139.888, 35.668],
    center: [139.8770, 35.6590],
    geojson_path: "./data/higashikasai_buildings.geojson",
    fallback_geojson_path: "./data/higashikasai_buildings.geojson",
    address_prefix: "東京都江戸川区東葛西"
  }
];
let DATASETS = DEFAULT_DATASETS;

const INIT_CENTER = [139.83, 35.66];
const INIT_ZOOM = 12;
const DATASET_LOAD_ZOOM = 14.5;
const SHADOW_ZOOM = 15;
const DETAIL_ZOOM = 18.5;
const MAX_SHADOW_M = 300;

let BUILDINGS = turf.featureCollection([]);
let VIEW_SHADOW_SRC = [];
let loadedDatasets = new Map();
let activeDatasets = [];
let highlightedFeature = null;
let brightnessOn = true;
let mode3d = false;
let currentAreaForSearch = null;
let viewRefreshTimer = null;
let shadowRedrawPending = false;

const el = (id) => document.getElementById(id);
const dateInput = el("date"), timeInput = el("time"), timeLabel = el("timeLabel");
const altOut = el("alt"), azOut = el("az");
const errBox = el("errBox"), brightness = el("brightness"), shadowCanvas = el("shadowCanvas");
const dateBtns = el("dateBtns"), dateErr = el("dateErr");
const selKu = el("selKu"), selArea = el("selArea"), currentAreaEl = el("currentArea");
const areaNotice = el("areaNotice");
const searchInput = el("searchInput"), searchBtn = el("searchBtn"), searchMsg = el("searchMsg");

const HEIGHT_COLOR = ["step", ["get", "height"], "#3a9d8f", 10, "#3f7fd6", 31, "#e8833a"];

const pad2 = (n) => String(n).padStart(2, "0");
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function isValidDate(str){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(str||""); if(!m) return false;
  const y=+m[1], mo=+m[2], d=+m[3];
  const dt=new Date(y, mo-1, d);
  return dt.getFullYear()===y && dt.getMonth()===mo-1 && dt.getDate()===d;
}
dateInput.value = todayStr();

function showNotice(msg, kind){
  areaNotice.textContent = msg || "";
  areaNotice.style.color = kind==="error" ? "#ffb4b4" : "#ffd24a";
}
function showError(msg){
  errBox.style.display = msg ? "block" : "none";
  errBox.innerHTML = msg || "";
}
function fmtTime(v){ const h=Math.floor(v),m=Math.round((v-h)*60);
  return String(h).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function getSelectedDate(){
  const [y,mo,d]=dateInput.value.split("-").map(Number);
  const v=parseFloat(timeInput.value), h=Math.floor(v), mi=Math.round((v-h)*60);
  return new Date(Date.UTC(y,mo-1,d,h-9,mi));
}
function computeSun(){
  const c=map.getCenter();
  const p=SunCalc.getPosition(getSelectedDate(), c.lat, c.lng);
  const altDeg=p.altitude*180/Math.PI;
  const sunBearing=(p.azimuth*180/Math.PI+180+360)%360;
  return { altDeg, shadowBearing:(sunBearing+180)%360, sunBearing };
}
function cross2d(o,a,b){return(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);}
function convexHull(pts){
  pts.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  if(pts.length<3) return null;
  const lo=[],up=[];
  for(const p of pts){while(lo.length>=2&&cross2d(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  for(let i=pts.length-1;i>=0;i--){const p=pts[i];while(up.length>=2&&cross2d(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
  lo.pop();up.pop();const h=lo.concat(up);h.push(h[0]);return h;
}
function boundsToBox(bounds, margin=0){
  return [bounds.getWest()-margin, bounds.getSouth()-margin, bounds.getEast()+margin, bounds.getNorth()+margin];
}
function boxesIntersect(a,b){
  return a[0] <= b[2] && a[2] >= b[0] && a[1] <= b[3] && a[3] >= b[1];
}
function featureInBox(feature, box){
  const bb = feature._bbox || turf.bbox(feature);
  feature._bbox = bb;
  return boxesIntersect(bb, box);
}
function centroidCoords(feature){
  try{ return turf.centroid(feature).geometry.coordinates; }
  catch(e){ return feature.geometry.coordinates[0][0]; }
}
function datasetById(id){ return DATASETS.find(d=>d.dataset_id===id) || null; }
function datasetForPoint(lon, lat){
  return DATASETS.find(d=>lon>=d.bbox[0]&&lon<=d.bbox[2]&&lat>=d.bbox[1]&&lat<=d.bbox[3]) || null;
}
function datasetForFeature(feature){
  return datasetById(feature && feature.properties && feature.properties.dataset_id);
}
function selectDataset(dataset){
  if(!dataset) return;
  selKu.value = dataset.ward;
  selKu.dispatchEvent(new Event("change"));
  selArea.value = dataset.dataset_id;
  currentAreaForSearch = dataset;
}
async function loadDatasetManifest(){
  try{
    const r = await fetch("./data/datasets.json", {cache:"no-cache"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const manifest = await r.json();
    if(Array.isArray(manifest.datasets) && manifest.datasets.length) DATASETS = manifest.datasets;
  }catch(e){
    DATASETS = DEFAULT_DATASETS;
  }
}

async function fetchDataset(dataset){
  if(loadedDatasets.has(dataset.dataset_id)) return loadedDatasets.get(dataset.dataset_id);
  let r;
  try{
    r = await fetch(dataset.geojson_path, {cache:"no-cache"});
    if(r.status===404 && dataset.fallback_geojson_path) r = await fetch(dataset.fallback_geojson_path, {cache:"no-cache"});
  }catch(e){
    throw new Error("データ取得に失敗しました。静的サーバで開いてください。");
  }
  if(!r.ok) throw new Error("データの読み込みに失敗しました");
  const fc = await r.json();
  const features = (fc.features || []).map((f, index)=>{
    f.properties = f.properties || {};
    f.properties.dataset_id = dataset.dataset_id;
    f.properties.dataset_label = dataset.label;
    f.properties.feature_index = index;
    f.properties.height = Number(f.properties.height ?? f.properties.measuredHeight) || 0;
    f._bbox = turf.bbox(f);
    return f;
  });
  const cached = { dataset, fc: turf.featureCollection(features) };
  loadedDatasets.set(dataset.dataset_id, cached);
  return cached;
}

async function ensureDatasetsForView(){
  if(map.getZoom() < DATASET_LOAD_ZOOM){
    activeDatasets = [];
    return [];
  }
  const viewBox = boundsToBox(map.getBounds());
  const intersecting = DATASETS.filter(d=>boxesIntersect(viewBox, d.bbox));
  await Promise.all(intersecting.map(fetchDataset));
  activeDatasets = intersecting;
  return intersecting;
}

function updateAreaText(){
  const labels = activeDatasets.map(d=>d.label);
  currentAreaEl.textContent = labels.length ? "表示中の地域：" + labels.join(" / ") : "表示中の地域：未対応エリア";
}

function setEmptyView(message){
  BUILDINGS = turf.featureCollection([]);
  VIEW_SHADOW_SRC = [];
  map.getSource("buildings").setData(BUILDINGS);
  clearShadowCanvas();
  clearHighlight();
  updateAreaText();
  showNotice(message === undefined ? "この地域の建物データはまだありません" : message, message ? "error" : "");
}

async function refreshView(opts={}){
  if(!map.getSource("buildings")) return;
  if(map.getZoom() < DATASET_LOAD_ZOOM){
    setEmptyView("");
    currentAreaEl.textContent = "表示中の地域：未選択";
    return;
  }
  try{
    const datasets = await ensureDatasetsForView();
    if(!datasets.length){
      setEmptyView("この地域の建物データはまだありません");
      return;
    }
    const viewBox = boundsToBox(map.getBounds());
    const features = [];
    for(const dataset of datasets){
      const cached = loadedDatasets.get(dataset.dataset_id);
      if(!cached) continue;
      for(const f of cached.fc.features){
        if(featureInBox(f, viewBox)) features.push(f);
      }
    }
    BUILDINGS = turf.featureCollection(features);
    VIEW_SHADOW_SRC = features.map(f=>({f, h:Number(f.properties.height)||0})).filter(x=>x.h>0);
    map.getSource("buildings").setData(BUILDINGS);
    updateAreaText();
    if(features.length){
      showError("");
      showNotice("");
      if(highlightedFeature && !features.some(f=>sameFeature(f, highlightedFeature))) {
        map.getSource("highlight").setData(turf.featureCollection([highlightedFeature]));
      }
      recompute(true);
    } else {
      clearShadowCanvas();
      showNotice("この地域の建物データはまだありません", "error");
    }
  }catch(e){
    setEmptyView("データの読み込みに失敗しました");
    showError("データの読み込みに失敗しました。表示範囲を調整してください");
  }
}

function sameFeature(a,b){
  if(!a || !b) return false;
  const ap=a.properties||{}, bp=b.properties||{};
  if(ap.gml_id && bp.gml_id) return ap.gml_id===bp.gml_id;
  return ap.dataset_id===bp.dataset_id && ap.feature_index===bp.feature_index;
}

function scheduleRefreshView(){
  clearTimeout(viewRefreshTimer);
  viewRefreshTimer = setTimeout(()=>refreshView(), 120);
}
function scheduleShadowRedraw(){
  if(shadowRedrawPending) return;
  shadowRedrawPending = true;
  requestAnimationFrame(()=>{
    shadowRedrawPending = false;
    if(BUILDINGS.features.length) recompute();
  });
}

function resizeShadowCanvas(){
  const rect = map.getCanvas().getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(rect.width * dpr));
  const h = Math.max(1, Math.round(rect.height * dpr));
  if(shadowCanvas.width !== w || shadowCanvas.height !== h){
    shadowCanvas.width = w;
    shadowCanvas.height = h;
    shadowCanvas.style.width = rect.width + "px";
    shadowCanvas.style.height = rect.height + "px";
  }
  return { width: rect.width, height: rect.height, dpr };
}

function clearShadowCanvas(){
  const ctx = shadowCanvas.getContext("2d");
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,shadowCanvas.width,shadowCanvas.height);
}

function drawShadowMask(rings){
  const { width, height, dpr } = resizeShadowCanvas();
  const mask = document.createElement("canvas");
  mask.width = shadowCanvas.width;
  mask.height = shadowCanvas.height;
  const maskCtx = mask.getContext("2d");
  maskCtx.setTransform(dpr,0,0,dpr,0,0);
  maskCtx.fillStyle = "#000";
  maskCtx.beginPath();
  for(const ring of rings){
    if(!ring || ring.length < 3) continue;
    const p0 = map.project(ring[0]);
    maskCtx.moveTo(p0.x, p0.y);
    for(let i=1;i<ring.length;i++){
      const p = map.project(ring[i]);
      maskCtx.lineTo(p.x, p.y);
    }
    maskCtx.closePath();
  }
  maskCtx.fill();

  const ctx = shadowCanvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,width,height);
  ctx.save();
  ctx.globalAlpha = 0.45;
  ctx.fillStyle = "#16335f";
  ctx.fillRect(0,0,width,height);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "destination-in";
  ctx.drawImage(mask,0,0,width,height);
  ctx.restore();
}

function updateShadows(sun){
  sun = sun || computeSun();
  const zoom = map.getZoom();
  if(zoom < SHADOW_ZOOM){
    clearShadowCanvas();
    if(BUILDINGS.features.length) showNotice("拡大すると影を表示します");
    return;
  }
  if(!BUILDINGS.features.length){
    clearShadowCanvas();
    return;
  }

  const shadowRings=[];
  if(sun.altDeg>0.5){
    const bearRad=sun.shadowBearing*Math.PI/180;
    const sinB=Math.sin(bearRad), cosB=Math.cos(bearRad);
    const clat=map.getCenter().lat*Math.PI/180;
    const dxPerM=1/(111320*Math.cos(clat));
    const dyPerM=1/110540;
    const tanAlt=Math.tan(sun.altDeg*Math.PI/180);
    for(const item of VIEW_SHADOW_SRC){
      let L=item.h/tanAlt;
      if(!isFinite(L)||L<=0) continue;
      L=Math.min(L,MAX_SHADOW_M);
      const dx=L*sinB*dxPerM, dy=L*cosB*dyPerM;
      const ring=item.f.geometry.coordinates[0];
      const pts=[];
      for(const p of ring){ pts.push([p[0],p[1]]); pts.push([p[0]+dx,p[1]+dy]); }
      const hull=convexHull(pts);
      if(hull) shadowRings.push(hull);
    }
  }
  if(shadowRings.length===0){
    clearShadowCanvas();
    showNotice("");
    return;
  }
  try{
    drawShadowMask(shadowRings);
    showNotice("");
  }catch(e){
    clearShadowCanvas();
    showNotice("影の計算に失敗しました。表示範囲を調整してください", "error");
  }
}

function updateBrightness(sun){
  if(!brightnessOn){ brightness.style.background="transparent"; return; }
  const a=sun.altDeg;
  if(a>25) brightness.style.background="rgba(0,0,0,0)";
  else if(a>0){
    const k=(25-a)/25;
    brightness.style.background="rgba(255,150,70,"+(k*0.40).toFixed(3)+")";
  } else {
    const k=Math.min(1,(-a)/12);
    brightness.style.background="rgba(10,16,38,"+(0.45+k*0.30).toFixed(3)+")";
  }
}
function showReadout(sun){
  altOut.textContent=sun.altDeg.toFixed(1)+"°";
  azOut.textContent=sun.sunBearing.toFixed(0)+"°";
}
function recomputeSunOnly(){
  if(!isValidDate(dateInput.value)){ dateErr.textContent="存在しない日付です"; return; }
  dateErr.textContent="";
  const sun=computeSun();
  showReadout(sun);
  updateBrightness(sun);
}
function recompute(){
  if(!isValidDate(dateInput.value)){ dateErr.textContent="存在しない日付です"; return; }
  dateErr.textContent="";
  const sun=computeSun();
  showReadout(sun);
  updateShadows(sun);
  updateBrightness(sun);
}

const map=new maplibregl.Map({
  container:"map", center:INIT_CENTER, zoom:INIT_ZOOM,
  style:{ version:8,
    glyphs:"https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
    sources:{ osm:{ type:"raster",
      tiles:["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], tileSize:256,
      attribution:"地図・建物名 © OpenStreetMap contributors / 建物形状 © PLATEAU (国土交通省)" }},

});
map.addControl(new maplibregl.NavigationControl(),"top-right");

function initLayers(){
  map.addSource("buildings",{type:"geojson",data:turf.featureCollection([])});
  map.addLayer({id:"bldg-fill",type:"fill",source:"buildings",
    paint:{"fill-color":HEIGHT_COLOR,"fill-opacity":0.42}});
  map.addLayer({id:"bldg-line",type:"line",source:"buildings",
    paint:{"line-color":"#6b7888","line-width":0.5,"line-opacity":0.65}});
  map.addLayer({id:"bldg-extrusion",type:"fill-extrusion",source:"buildings",
    layout:{visibility:"none"},
    paint:{"fill-extrusion-color":HEIGHT_COLOR,
           "fill-extrusion-height":["get","height"],
           "fill-extrusion-base":0,
           "fill-extrusion-opacity":1}});

  // 高亮: 検索/選択された建物（目立つ金色）
  map.addSource("highlight",{type:"geojson",data:turf.featureCollection([])});
  map.addLayer({id:"highlight-fill",type:"fill",source:"highlight",
    paint:{"fill-color":"#ffd000","fill-opacity":0.6}});
  map.addLayer({id:"highlight-line",type:"line",source:"highlight",
    paint:{"line-color":"#ffb300","line-width":3}});
  map.addLayer({id:"highlight-extrusion",type:"fill-extrusion",source:"highlight",

    paint:{"fill-extrusion-color":"#ffcb1f","fill-extrusion-height":["get","height"],
           "fill-extrusion-base":0,"fill-extrusion-opacity":1}});
}

function highlightBuilding(feature){
  highlightedFeature = feature;
  const f = JSON.parse(JSON.stringify(feature));
  map.getSource("highlight").setData(turf.featureCollection([f]));
}
function clearHighlight(updateSource=true){
  highlightedFeature = null;
  if(updateSource && map.getSource("highlight")) map.getSource("highlight").setData(turf.featureCollection([]));
}

// 住所を「番-号」だけに短縮（丁目は出さない）
function shortenAddress(s){
  if(!s) return "";
  s=String(s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFF10+0x30)).replace(/[ー－―−—]/g,"-");
  let m;
  if((m=s.match(/(\d+)丁目(\d+)番(\d+)号/))) return m[2]+"-"+m[3];
  if((m=s.match(/(\d+)番(\d+)号/)))         return m[1]+"-"+m[2];
  if((m=s.match(/(\d+)-(\d+)-(\d+)/)))      return m[2]+"-"+m[3];
  if((m=s.match(/(\d+)-(\d+)/)))            return m[1]+"-"+m[2];
  if((m=s.match(/(\d+)番/)))                return m[1];
  return s;
}

// 2D/3D 切替
function setMode(is3d, skipCamera){
  mode3d=is3d;
  map.setLayoutProperty("bldg-extrusion","visibility", is3d?"visible":"none");
  map.setLayoutProperty("bldg-fill","visibility", is3d?"none":"visible");
  map.setLayoutProperty("highlight-extrusion","visibility", is3d?"visible":"none");
  el("b3d").classList.toggle("active", is3d);
  el("b2d").classList.toggle("active", !is3d);
  if(skipCamera) return;  // 復元時はカメラを動かさない（jumpTo の pitch/bearing を維持）
  if(is3d) map.easeTo({pitch:60,bearing:-30,duration:500});
  else     map.easeTo({pitch:0,bearing:0,duration:500});
}

timeInput.addEventListener("input",()=>{ timeLabel.textContent=fmtTime(parseFloat(timeInput.value));
  clearTimeout(window._t); window._t=setTimeout(()=>recompute(),80); });
timeInput.addEventListener("change",()=>recompute());
map.on("move",()=>scheduleShadowRedraw());

map.on("moveend",()=>scheduleRefreshView());

// --- 日付選択（今日 / 節気 / カスタム）---
function markDateActive(btn){
  dateBtns.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");
}
function applyDate(str, btn){
  if(!isValidDate(str)){ dateErr.textContent="存在しない日付です"; return; } // 非法→何も更新しない
  dateErr.textContent="";
  dateInput.value=str;
  markDateActive(btn);
  recompute();
}
dateBtns.addEventListener("click",(e)=>{
  const b=e.target.closest("button"); if(!b) return;
  const preset=b.dataset.preset;
  if(preset==="custom"){
    dateInput.style.display="block";      // カスタムのときだけ <input type=date> を表示
    markDateActive(b);
    dateInput.focus();
    return;                               // 日付確定は input の change で行う
  }
  dateInput.style.display="none";
  if(preset==="today"){ applyDate(todayStr(), b); return; }
  // 節気: 現在選択中の年（無ければ今年）に対して設定
  const y=(dateInput.value.split("-")[0]) || String(new Date().getFullYear());
  applyDate(`${y}-${pad2(+b.dataset.mo)}-${pad2(+b.dataset.d)}`, b);
});
// <input type=date> は 2/31・4/31 等を弾く。閏年含め JS でも再検証する。
dateInput.addEventListener("change",()=>{
  applyDate(dateInput.value, dateBtns.querySelector('[data-preset="custom"]'));
});

el("b2d").addEventListener("click",()=>setMode(false));
el("b3d").addEventListener("click",()=>setMode(true));
el("bnorth").addEventListener("click",()=>map.easeTo({bearing:0,duration:500}));

// トグル
el("tgBright").addEventListener("change",(e)=>{ brightnessOn=e.target.checked; recomputeSunOnly(); });

// ========== 住所検索（国土地理院 API + 自動区域判定 + 建物マッチ）==========

// 入力を正規化
function normalizeAddressInput(raw){
  let s = (raw||"").trim();
  s = s.replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFF10+0x30)); // 全角→半角
  s = s.replace(/[ー－―−—]/g, "-");   // 各種ダッシュ→ハイフン
  s = s.replace(/\s+/g, "");           // 空白除去
  // 「丁目内」混在: 6丁目14-10 → 6丁目14番10号
  s = s.replace(/丁目(\d+)-(\d+)/, "丁目$1番$2号");
  s = s.replace(/丁目(\d+)-/, "丁目$1番");
  // N-M-K → N丁目M番K号
  let m;
  if((m=s.match(/^(\d+)-(\d+)-(\d+)$/))) s = `${m[1]}丁目${m[2]}番${m[3]}号`;
  else if((m=s.match(/^(\d+)-(\d+)$/)))  s = `${m[1]}丁目${m[2]}番`;
  return s;
}

// 建物マッチ + 高亮
function matchBuilding(lon, lat){
  if(!BUILDINGS.features.length) return null;
  const pt=turf.point([lon,lat]);
  let found=null, inPoly=false, minD=Infinity;
  // 1) polygon 内
  for(const f of BUILDINGS.features){
    try{ if(turf.booleanPointInPolygon(pt,f)){found=f;inPoly=true;break;} }catch(e){}
  }
  if(!found){
    for(const f of BUILDINGS.features){
      try{ const c=turf.centroid(f); const d=turf.distance(pt,c,{units:"meters"});
        if(d<minD){minD=d;found=f;} }catch(e){}
    }
    if(minD>30){ found=null; }
  }
  if(found){
    const h=Number(found.properties.height)||0;
    const c=turf.centroid(found).geometry.coordinates;
    map.flyTo({center:c, zoom:DETAIL_ZOOM, duration:700});
    highlightBuilding(found);
    map.once("moveend", ()=>openBuildingPopup(found, c));
    searchMsg.textContent=(inPoly?"建物内":"最寄り"+Math.round(minD)+"m")+" → 高さ"+h.toFixed(1)+"m";
  } else {
    clearHighlight();
    searchMsg.textContent="該当する建物が見つかりません"+(minD<Infinity?" (最寄り"+Math.round(minD)+"m)":"");
  }
  return found;
}

// メイン検索フロー: 入力 → normalize → 国土地理院 API → 区域判定 → 建物マッチ
async function searchAddress(){
  const raw=searchInput.value.trim();
  if(!raw){ searchMsg.textContent="住所を入力してください"; return; }

  let q = normalizeAddressInput(raw);
  const selected = currentAreaForSearch || (selArea.value ? datasetById(selArea.value) : null);
  if(/^\d/.test(q) && selected) q = selected.address_prefix + q;
  if(q && !q.startsWith("東京都") && /^[^\d]/.test(q)){
    for(const d of DATASETS) if(q.startsWith(d.address_prefix.replace("東京都",""))) q="東京都"+q;
  }

  searchMsg.textContent="検索中…";

  try{
    const url="https://msearch.gsi.go.jp/address-search/AddressSearch?q="+encodeURIComponent(q);
    const r=await fetch(url);
    const results=await r.json();
    if(!results.length){ searchMsg.textContent="該当する建物が見つかりません"; return; }

    let best=results[0];
    if(selected){
      const bb=selected.bbox;
      if(bb){
        const inArea=results.find(r=>{
          const c=r.geometry&&r.geometry.coordinates;
          return c&&c[0]>=bb[0]&&c[0]<=bb[2]&&c[1]>=bb[1]&&c[1]<=bb[3];
        });
        if(inArea) best=inArea;
      }
    }
    const [lon,lat]=best.geometry.coordinates;
    const dataset=datasetForPoint(lon,lat);
    if(!dataset){
      searchMsg.textContent="この地域の建物データはまだありません";
      clearHighlight(); return;
    }

    selectDataset(dataset);
    await fetchDataset(dataset);
    map.jumpTo({center:[lon,lat], zoom:DETAIL_ZOOM});
    await refreshView();
    matchBuilding(lon, lat);
  }catch(e){ searchMsg.textContent="検索中にエラーが発生しました"; }
}
searchBtn.addEventListener("click", searchAddress);
searchInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter") searchAddress(); });

// --- sessionStorage: detail.html 往復で地図状態を保存/復元 ---
function saveMapState(bid){
  const ds = highlightedFeature ? datasetForFeature(highlightedFeature) : (currentAreaForSearch || activeDatasets[0] || null);
  const state = {
    center:[map.getCenter().lng,map.getCenter().lat],
    zoom:map.getZoom(), pitch:map.getPitch(), bearing:map.getBearing(),
    dataset_id: ds ? ds.dataset_id : "",
    date:dateInput.value, time:timeInput.value,
    buildingId:bid||"",
    viewMode: mode3d?"3D":"2D", mode3d: mode3d
  };
  sessionStorage.setItem("sunmap", JSON.stringify(state));
  sessionStorage.setItem("shouldRestoreMapState", "true");
}

function openBuildingPopup(feature, lngLat){
  const props=feature.properties||{};
  const h=Number(props.height)||0;
  const floors=Math.max(1,Math.round(h/3));
  const addrShort=props.addr?shortenAddress(props.addr):"";
  let buildingId=props.gml_id;
  if(!buildingId){
    const idx=props.feature_index ?? BUILDINGS.features.findIndex(f=>sameFeature(f,feature));
    buildingId="index-"+idx; // TODO: 安定IDに置き換える
  }
  const dataset = datasetForFeature(feature);
  const geoUrl=dataset ? dataset.geojson_path : "";
  const url="detail.html?buildingId="+encodeURIComponent(buildingId)
    +"&geojson="+encodeURIComponent(geoUrl)
    +"&date="+encodeURIComponent(dateInput.value)
    +"&time="+encodeURIComponent(timeInput.value);
  let html="<div style='color:#111;font-size:13px;line-height:1.6'>";
  if(dataset) html+="地域: <b>"+dataset.label+"</b><br>";
  if(addrShort) html+="住所: <b>"+addrShort+"</b><br>";
  html+="建築高さ: <b>"+h.toFixed(1)+" m</b><br>推定階数: <b>"+floors+" 階</b>"
    +"<br><span style='color:#777;font-size:11px'>（推定階数 = 高さ ÷ 3m）</span>"
    +"<br><a data-detail href='"+url+"' style='display:inline-block;margin-top:8px;padding:6px 10px;"
    +"background:#ffb53d;color:#1a1205;border-radius:6px;font-weight:700;"
    +"text-decoration:none;font-size:12px'>この建物の光を見る</a></div>";
  const popup = new maplibregl.Popup({closeButton:true, maxWidth:"260px"})
    .setLngLat(lngLat).setHTML(html).addTo(map);
  highlightBuilding(feature);
  const detailLink = popup.getElement() && popup.getElement().querySelector("a[data-detail]");
  if(detailLink) detailLink.addEventListener("click",()=>saveMapState(buildingId));
}

// 建物クリック
function onBldgClick(e){
  const fs=map.queryRenderedFeatures(e.point,{layers:["bldg-fill","bldg-extrusion"]});
  if(!fs.length) return;
  const gid=fs[0].properties&&fs[0].properties.gml_id;
  const dsid=fs[0].properties&&fs[0].properties.dataset_id;
  const index=Number(fs[0].properties&&fs[0].properties.feature_index);
  const real=BUILDINGS.features.find(f=>
    (gid && f.properties.gml_id===gid) ||
    (f.properties.dataset_id===dsid && f.properties.feature_index===index)
  );
  openBuildingPopup(real||fs[0], e.lngLat);
}
map.on("click", onBldgClick);
["bldg-fill","bldg-extrusion"].forEach(id=>{
  map.on("mouseenter",id,()=>map.getCanvas().style.cursor="pointer");
  map.on("mouseleave",id,()=>map.getCanvas().style.cursor="");
});

map.on("load", async ()=>{
  initLayers();
  await loadDatasetManifest();
  const wards=[...new Set(DATASETS.map(d=>d.ward))];
  for(const ward of wards) selKu.insertAdjacentHTML("beforeend",`<option value="${ward}">${ward}</option>`);
  selKu.addEventListener("change",()=>{
    selArea.innerHTML='<option value="">地域を選択</option>';
    for(const d of DATASETS.filter(x=>x.ward===selKu.value)){
      selArea.insertAdjacentHTML("beforeend",`<option value="${d.dataset_id}">${d.area}</option>`);
    }
  });
  selArea.addEventListener("change",()=>{
    const dataset = datasetById(selArea.value);
    if(!dataset) return;
    currentAreaForSearch = dataset;
    clearHighlight();
    showNotice("");
    map.flyTo({center:dataset.center, zoom:17, duration:800});
  });

  const _params=new URLSearchParams(location.search);
  const saved=sessionStorage.getItem("sunmap");
  const hasRestoreState = (_params.get("restore")==="1" ||
                           sessionStorage.getItem("shouldRestoreMapState")==="true") && !!saved;

  if(hasRestoreState){
    try{
      const s=JSON.parse(saved);
      const dataset = datasetById(s.dataset_id);
      if(dataset) selectDataset(dataset);
      if(s.date) dateInput.value=s.date;
      if(s.time!=null){ timeInput.value=s.time; timeLabel.textContent=fmtTime(parseFloat(timeInput.value)); }
      if(s.mode3d) setMode(true, true);
      map.jumpTo({center:s.center, zoom:s.zoom, pitch:s.pitch||0, bearing:s.bearing||0});
      refreshView().then(()=>{
        let f=null; const bid=s.buildingId||"";
        if(bid && !bid.startsWith("index-")) f=BUILDINGS.features.find(x=>x.properties.gml_id===bid);
        if(!f && bid.startsWith("index-")){
          const i=parseInt(bid.replace("index-",""),10);
          f=BUILDINGS.features.find(x=>x.properties.feature_index===i && (!dataset || x.properties.dataset_id===dataset.dataset_id));
        }
        if(f){ const c=turf.centroid(f).geometry.coordinates; openBuildingPopup(f, c); }
        sessionStorage.removeItem("sunmap");
        sessionStorage.removeItem("shouldRestoreMapState");
        if(history.replaceState) history.replaceState(null,"",location.pathname);
      });
    }catch(e){
      sessionStorage.removeItem("shouldRestoreMapState");
      refreshView();
    }
  } else {
    currentAreaEl.textContent = "表示中の地域：未選択";
    showNotice("");
    recomputeSunOnly();
  }
});
