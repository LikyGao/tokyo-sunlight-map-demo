<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111820" />
<title>PLATEAU LOD2 プレビュー</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/"
} }
</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#111820;color:#edf2f7;font-family:system-ui,"Yu Gothic",Meiryo,sans-serif}
#c{position:absolute;inset:0}
#panel{position:absolute;z-index:2;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));
  display:flex;gap:8px;align-items:center;max-width:560px;margin:auto}
select,a{height:42px;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:rgba(20,28,38,.92);
  color:#edf2f7;font:600 14px system-ui,"Yu Gothic",Meiryo,sans-serif}
select{flex:1;padding:0 10px}
a{display:inline-flex;align-items:center;padding:0 12px;text-decoration:none}
#info{position:absolute;z-index:2;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  max-width:560px;margin:auto;padding:10px 12px;border-radius:8px;background:rgba(20,28,38,.86);
  border:1px solid rgba(255,255,255,.14);font-size:12px;line-height:1.5;color:#b8c4d2}
#info b{color:#ffb53d}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <select id="modelSelect" aria-label="モデル選択">
    <option value="tokyo_tower">東京タワー</option>
    <option value="tokyo_skytree">東京スカイツリー</option>
    <option value="roppongi_hills_mori_tower">六本木ヒルズ森タワー</option>
  </select>
  <a href="index.html">地図へ</a>
</div>
<div id="info">読み込み中...</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const MODEL_URLS = {
  tokyo_tower: "./data/landmarks/lod2/tokyo_tower_lod2_surfaces.json",
  tokyo_skytree: "./data/landmarks/lod2/tokyo_skytree_lod2_surfaces.json",
  roppongi_hills_mori_tower: "./data/landmarks/lod2/roppongi_hills_mori_tower_lod2_surfaces.json"
};

const canvas = document.getElementById("c");
const info = document.getElementById("info");
const select = document.getElementById("modelSelect");

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setClearColor(0x111820, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x111820, 700, 1500);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 3000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 170, 0);

scene.add(new THREE.HemisphereLight(0xd7ecff, 0x26313f, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(-250, 500, 320);
scene.add(key);

const grid = new THREE.GridHelper(260, 13, 0x385064, 0x263847);
scene.add(grid);

let group = null;

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

function toLocalFactory(data){
  const pts = data.surfaces.flat();
  const lon0 = pts.reduce((s,p)=>s+p[0],0) / pts.length;
  const lat0 = pts.reduce((s,p)=>s+p[1],0) / pts.length;
  const cos = Math.cos(lat0 * Math.PI / 180);
  return ([lon, lat, z]) => new THREE.Vector3(
    (lon - lon0) * 111320 * cos,
    z,
    -(lat - lat0) * 110540
  );
}

function addSurfaceMesh(parent, data){
  const toLocal = toLocalFactory(data);
  const vertices = [];
  const indices = [];
  const linePts = [];
  for(const surface of data.surfaces){
    const clean = surface.slice();
    if(clean.length > 1){
      const a = clean[0], b = clean[clean.length - 1];
      if(Math.abs(a[0]-b[0]) < 1e-10 && Math.abs(a[1]-b[1]) < 1e-10 && Math.abs(a[2]-b[2]) < 1e-6) clean.pop();
    }
    if(clean.length < 3) continue;
    const base = vertices.length / 3;
    for(const p of clean){
      const v = toLocal(p);
      vertices.push(v.x, v.y, v.z);
      linePts.push(v.x, v.y, v.z);
    }
    linePts.push(...linePts.slice(linePts.length - clean.length * 3, linePts.length - clean.length * 3 + 3));
    for(let i=1; i<clean.length-1; i++) indices.push(base, base+i, base+i+1);
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  const mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({
    color: 0xe8752b,
    roughness: 0.72,
    metalness: 0.05,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.94
  }));
  parent.add(mesh);

  const lineGeom = new THREE.BufferGeometry();
  lineGeom.setAttribute("position", new THREE.Float32BufferAttribute(linePts, 3));
  const lines = new THREE.LineSegments(lineGeom, new THREE.LineBasicMaterial({
    color: 0xffd08a,
    transparent: true,
    opacity: 0.28
  }));
  parent.add(lines);
}

async function loadModel(id){
  info.textContent = "読み込み中...";
  const data = await fetch(MODEL_URLS[id], { cache: "no-cache" }).then(r => r.json());
  if(group) scene.remove(group);
  group = new THREE.Group();
  addSurfaceMesh(group, data);
  scene.add(group);

  const box = new THREE.Box3().setFromObject(group);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  group.position.sub(center);
  group.position.y += size.y / 2;
  controls.target.set(0, size.y * 0.45, 0);
  camera.position.set(size.x * 1.6 + 160, size.y * 0.55, size.z * 1.9 + 220);
  camera.near = 0.1;
  camera.far = Math.max(1200, size.y * 5);
  camera.updateProjectionMatrix();
  controls.update();

  info.innerHTML = `<b>${data.id}</b> / PLATEAU LOD2 / surfaces: <b>${data.surface_count}</b> / z: <b>${data.bbox[2].toFixed(1)}-${data.bbox[5].toFixed(1)}m</b>`;
}

select.addEventListener("change", () => loadModel(select.value));
loadModel(select.value);

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
