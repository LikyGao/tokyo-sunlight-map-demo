<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="日当たりマップ">
  <link rel="manifest" href="./mapbox.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./assets/icons/icon-192.png">
  <title>日当たりマップ</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
  <link href="./mapbox-demo.css?v=3" rel="stylesheet">
</head>
<body>
  <div id="map" aria-label="日当たりマップ"></div>
  <main id="map-ui" hidden>
    <header id="search-area">
      <form id="search-form" role="search">
        <input id="search" type="search" aria-label="住所・建物名・駅名を検索" placeholder="住所・建物名・駅名を検索" autocomplete="off" enterkeyhint="search" maxlength="256" aria-controls="search-results" aria-expanded="false">
        <button class="icon-button" type="submit" aria-label="検索" title="検索"><i data-lucide="search"></i></button>
      </form>
      <section id="search-results" aria-label="検索結果" hidden>
        <div class="results-head"><span id="search-status" role="status"></span><button class="icon-button" id="search-close" aria-label="検索結果を閉じる" title="閉じる"><i data-lucide="x"></i></button></div>
        <ul id="result-list"></ul>
        <small id="search-attribution"></small>
      </section>
    </header>
    <nav id="map-tools" aria-label="地図操作">
      <button class="icon-button" id="view-toggle" aria-label="2D表示に切り替え" title="2D表示に切り替え" aria-pressed="true"><i data-lucide="box"></i></button>
      <button class="icon-button" id="zoom-in" aria-label="拡大" title="拡大"><i data-lucide="plus"></i></button>
      <button class="icon-button" id="zoom-out" aria-label="縮小" title="縮小"><i data-lucide="minus"></i></button>
      <button class="icon-button compass" id="north" aria-label="北を上に戻す" title="北を上に戻す"><i data-lucide="navigation-2" id="north-arrow"></i><span>N</span></button>
      <button class="icon-button" id="floor-toggle" aria-label="階別の日当たり" title="階別の日当たり" aria-expanded="false" aria-controls="floor-panel" disabled><i data-lucide="building-2"></i><span id="floor-badge" hidden></span></button>
    </nav>
    <div id="bottom-dock">
      <section id="floor-panel" class="sheet" aria-label="階別の日当たり" tabindex="-1" hidden>
        <div class="sheet-head"><h2>階別の日当たり</h2><button class="icon-button" id="floor-close" aria-label="階の設定を閉じる" title="閉じる"><i data-lucide="x"></i></button></div>
        <form id="floor-form">
          <div class="floor-fields">
            <label>建物の総階数<input id="total-floors" type="number" min="1" max="300" step="1" required inputmode="numeric" enterkeyhint="next"></label>
            <label>確認する階<input id="target-floor" type="number" min="1" max="300" step="1" required inputmode="numeric" enterkeyhint="done"></label>
          </div>
          <div class="floor-actions"><button class="primary" id="floor-apply" type="submit">この階を表示</button><button id="floor-reset" type="button">解除</button></div>
        </form>
        <div class="floor-foot"><span id="floor-result" role="status"></span><small>高さを等分した目安</small></div>
        <p id="floor-error" class="error" role="alert"></p>
      </section>
      <section id="date-panel" class="sheet" aria-label="日付設定" tabindex="-1" hidden>
        <div class="sheet-head"><h2>日付</h2><button class="icon-button" id="date-close" aria-label="日付設定を閉じる" title="閉じる"><i data-lucide="x"></i></button></div>
        <form id="date-form"><label class="sr-only" for="date-input">日付を選択</label><input id="date-input" type="date" min="1900-01-01" max="2100-12-31" required><button class="primary" type="submit">適用</button></form>
        <div id="season-buttons" aria-label="季節を選択"><button data-season="mar_equinox">春分</button><button data-season="jun_solstice">夏至</button><button data-season="sep_equinox">秋分</button><button data-season="dec_solstice">冬至</button></div>
        <button id="today">今日</button><p id="date-error" class="error" role="alert"></p>
      </section>
      <section id="timeline" aria-label="日時設定">
        <div class="time-head"><button id="date-toggle" aria-label="日付設定" title="日付設定" aria-expanded="false" aria-controls="date-panel"><i data-lucide="calendar-days"></i><span id="date"></span></button><output id="clock" for="time">12:00</output><span class="timezone">JST</span></div>
        <input id="time" type="range" min="0" max="1439" step="1" value="720" aria-label="時刻（日本時間）">
        <div class="ticks" aria-hidden="true"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>
      </section>
    </div>
  </main>
  <p id="notice" role="status" hidden></p>
  <dialog id="setup"><form id="connect"><h1>日当たりマップ</h1><label>公開アクセストークン<input id="token" type="password" placeholder="pk.…" autocomplete="off" spellcheck="false" required></label><button class="primary" type="submit">地図を開く</button><p id="setup-error" class="error" role="alert"></p></form></dialog>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script>
  <script src="./assets/vendor/astronomy-2.1.19.min.js"></script>
  <script src="./assets/vendor/lucide.min.js"></script>
  <script src="./facade-tint.js?v=model-units-1"></script>
  <script src="./public-config.js"></script>
  <script src="./pwa-register.js"></script>
  <script type="module" src="./mapbox-demo.mjs?v=3"></script>
</body>
</html>
